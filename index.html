<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ხარშვის ასისტენტი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* =====================================================================
     დიზაინის სისტემა
     კონცეფცია: სამზარეულოს ხელსაწყოს პანელი — ერთი სვეტი, ციფრები ინსტრუმენტივით,
     თბილი „ალაოს" ნეიტრალები, ქარვისფერი აქცენტი. მხოლოდ ბნელი (სპეციფიკაციით).
     ===================================================================== */
  :root {
    color-scheme: dark;
    /* ფერი */
    --bg: #15110c;          /* მოხალული ალაო */
    --surface: #211b14;
    --surface-2: #2c241b;
    --line: #42382c;
    --fg: #f8f0e3;
    --muted: #bcae9a;
    --faint: #8a7d6b;
    --amber: #f6a823;       /* აქცენტი — ლუდი */
    --amber-soft: #3a2a10;
    --on-amber: #1b1204;
    --ok: #5fd394;  --ok-soft: #12301f;
    --warn: #ff8f45; --warn-soft: #3a2010;
    --bad: #ff6464; --bad-soft: #3d1414;
    --info: #9cc2ff; --info-soft: #18243a;
    --violet: #d7a8ff;
    /* ტიპოგრაფია */
    --font-ui: "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --t-xs: 0.8125rem; --t-sm: 0.9375rem; --t-md: 1.0625rem; --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-xxl: 4.5rem;
    /* ფორმა */
    --r: 14px; --r-sm: 10px;
    --tap: 56px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font-ui); font-size: var(--t-md); line-height: 1.5;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 620px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  main.wrap { padding-block: 8px 24px; display: flex; flex-direction: column; gap: 16px; }

  h1, h2, h3 { font-stretch: 80%; text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: var(--t-xl); font-weight: 800; }
  h2 { font-size: var(--t-lg); font-weight: 750; display: flex; align-items: center; gap: 8px; }
  h2 .ic { color: var(--amber); }
  h3 { font-size: var(--t-md); font-weight: 700; }
  p { margin: 0; }
  a { color: var(--amber); }
  .eyebrow { font-size: var(--t-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
  .muted { color: var(--muted); }
  .small { font-size: var(--t-sm); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .ic { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sec { display: flex; flex-direction: column; gap: 10px; }
  .sec:empty { display: none; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; }

  /* --- ზედაპირები --- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .panel.hl { border-color: var(--amber); }

  /* --- ღილაკები --- */
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: var(--tap); padding: 10px 16px; border-radius: var(--r-sm);
    border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg);
    font: inherit; font-weight: 700; cursor: pointer; width: 100%; text-decoration: none; text-align: center;
    touch-action: manipulation; transition: transform .08s, background .15s;
  }
  button:active, .btn:active { transform: scale(.97); }
  button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .ghost { background: transparent; }
  .danger { background: transparent; border-color: var(--bad-soft); color: var(--bad); }
  .icon-btn { width: var(--tap); min-width: var(--tap); padding: 0; flex: none; }
  button:disabled { opacity: .35; }
  .gated { opacity: .5; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > * { flex: 1; min-width: 0; }

  /* --- ველები --- */
  label.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  label.field > .lbl { font-size: var(--t-sm); color: var(--muted); font-weight: 600; }
  input, select, textarea {
    font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line);
    border-radius: var(--r-sm); padding: 12px 14px; width: 100%; min-height: var(--tap); min-width: 0;
  }
  textarea { min-height: 104px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); }
  .unit-in { position: relative; display: block; min-width: 0; }
  .unit-in input { padding-right: 2.6em; font-family: var(--font-num); font-weight: 600; }
  .unit-in > span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; font-size: var(--t-sm); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* დიდი ციფრული ველი ± ღილაკებით (სველი ხელებისთვის) */
  .reading { display: flex; flex-direction: column; gap: 6px; }
  .reading .lbl { font-size: var(--t-sm); color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
  .stepper button { min-height: 68px; padding: 0; font-size: 1.6rem; }
  .stepper .unit-in input { min-height: 68px; font-size: 2rem; text-align: center; padding: 8px 2.2em; }

  /* ჩეკლისტი */
  .checks { display: flex; flex-direction: column; }
  .check { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check:last-child { border-bottom: 0; }
  .check input { appearance: none; -webkit-appearance: none; width: 30px; height: 30px; min-height: 0; padding: 0; flex: none; border: 2px solid var(--faint); border-radius: 8px; background: var(--bg); display: grid; place-items: center; }
  .check input:checked { background: var(--amber); border-color: var(--amber); }
  .check input:checked::after { content: ""; width: 8px; height: 14px; border: solid var(--on-amber); border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
  .check.done > span { color: var(--faint); text-decoration: line-through; }

  /* გადამრთველი */
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; width: 54px; height: 32px; min-height: 0; padding: 0; border-radius: 99px; background: var(--surface-2); border: 1.5px solid var(--line); position: relative; flex: none; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .switch input:checked { background: var(--amber); border-color: var(--amber); }
  .switch input:checked::after { transform: translateX(22px); background: var(--on-amber); }

  /* სტატუსი */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; border: 1px solid currentColor; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.planned { color: var(--info); } .pill.brewing { color: var(--amber); } .pill.fermenting { color: var(--ok); }
  .pill.bottled { color: var(--violet); } .pill.done { color: var(--faint); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }

  /* შეტყობინებები */
  .msg { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); font-weight: 600; }
  .msg .ic { margin-top: 2px; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .msg.warn { background: var(--warn-soft); color: var(--warn); }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.info { background: var(--info-soft); color: var(--info); }

  /* სიის რიგები (ნავიგაცია) */
  .list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .list-row { display: flex; align-items: center; gap: 14px; padding: 14px; min-height: 68px; color: var(--fg); text-decoration: none; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; font-weight: 400; justify-content: flex-start; }
  .list-row:last-child { border-bottom: 0; }
  .list-row .ic.lead { color: var(--amber); width: 1.5em; height: 1.5em; }
  .list-row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .list-row .title { font-weight: 700; }
  .list-row .sub { font-size: var(--t-sm); color: var(--muted); }
  .list-row .chev { color: var(--faint); }

  /* პარტიის / რეცეპტის ბარათი */
  .batch { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--fg); text-decoration: none; }
  .batch .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .batch .top .ic { color: var(--faint); }
  .batch .name { font-weight: 750; font-size: var(--t-lg); font-stretch: 85%; min-width: 0; overflow-wrap: anywhere; }
  .meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--amber); border-radius: 3px; }

  /* ზედა ზოლი (ქვეგვერდები) */
  .appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .appbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; min-height: 64px; }
  .appbar .ttl { flex: 1; min-width: 0; font-weight: 750; font-stretch: 85%; font-size: var(--t-lg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .icon-btn { min-height: 48px; width: 48px; min-width: 48px; border-color: transparent; background: var(--surface); }
  .saved { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; transition: color .3s; }
  .saved.flash { color: var(--ok); }

  /* ქვედა ნავიგაცია */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-block: 6px; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; border-radius: var(--r-sm); color: var(--faint); text-decoration: none; font-size: var(--t-xs); font-weight: 700; }
  .tabbar a.on { color: var(--amber); background: var(--amber-soft); }

  /* ხარშვის რეჟიმი */
  .brewbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .brewbar .wrap { padding-block: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  .brewbar .row1 { display: flex; align-items: center; gap: 10px; }
  .brewbar .icon-btn { min-height: 48px; width: 48px; min-width: 48px; background: var(--surface); border-color: transparent; }
  .brewbar .icon-btn.on { color: var(--amber); }
  .brewbar .where { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .brewbar .where b { font-stretch: 85%; font-size: var(--t-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .segs > div { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .segs > div > i { display: block; height: 100%; background: var(--amber); }
  .step-head { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .step-head h1 { font-size: 2rem; }
  .instr { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: var(--t-lg); line-height: 1.4; }
  .instr li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; }
  .instr li::before { content: ""; width: 8px; height: 8px; margin-top: .6em; border-radius: 2px; background: var(--amber); transform: rotate(45deg); }
  .instr li.later { color: var(--muted); }
  .instr li.later::before { background: transparent; border: 2px solid var(--amber); }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .actionbar .wrap { display: grid; grid-template-columns: 56px 1fr 2fr; gap: 8px; padding-block: 10px; }
  .actionbar button { white-space: nowrap; padding: 8px 10px; }
  .stamp { display: inline-flex; align-self: flex-start; gap: 8px; align-items: center; color: var(--ok); font-weight: 700; font-size: var(--t-sm); }

  /* სკალა (ტემპერატურა/მოცულობა) */
  .gauge { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px 0; }
  .gauge .track { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); }
  .gauge .band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 35%, transparent); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
  .gauge .mark { position: absolute; top: -7px; width: 4px; height: 28px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
  .gauge .mark.out { background: var(--warn); }
  .gauge .scale { position: relative; height: 18px; font-family: var(--font-num); font-size: var(--t-xs); color: var(--faint); }
  .gauge .scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .gauge .scale span.end { transform: translateX(-100%); }
  .gauge .scale span.start { transform: none; }

  /* ტაიმერი */
  .timer { display: flex; flex-direction: column; gap: 12px; }
  .timer .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .timer .head .lbl { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--amber); }
  .digits { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--t-xxl); line-height: 1; text-align: center; letter-spacing: -0.02em; color: var(--fg); }
  .digits.paused { color: var(--faint); }
  .digits.over { color: var(--amber); }
  .digits.mini { font-size: 1.6rem; text-align: right; }
  .tbar { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); }
  .tbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); border-radius: 6px; }
  .tbar > b { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: var(--fg); border-radius: 2px; }
  .tbar > b.fired { background: var(--faint); }
  .alerts { display: flex; flex-direction: column; gap: 2px; }
  .alerts div { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; padding: 6px 0; font-size: var(--t-sm); border-top: 1px dashed var(--line); }
  .alerts div .num { color: var(--amber); }
  .alerts div.fired { color: var(--faint); }
  .alerts div.fired .num { color: var(--faint); text-decoration: line-through; }

  /* მაჩვენებლები */
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: baseline; }
  .kv > b { font-family: var(--font-num); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; }
  .stat .big { font-family: var(--font-num); font-weight: 600; font-size: 3rem; line-height: 1.05; color: var(--amber); }
  .stat .cap { font-size: var(--t-sm); color: var(--muted); text-align: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile .k { font-size: var(--t-xs); color: var(--muted); font-weight: 600; }
  .tile .v { font-family: var(--font-num); font-weight: 600; font-size: var(--t-lg); }
  .tile.warn .v { color: var(--warn); }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
  td, th { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: var(--t-xs); }
  td.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }

  details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  details > summary { min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 700; cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { margin-left: auto; transition: transform .15s; color: var(--faint); }
  details[open] > summary .chev { transform: rotate(90deg); }
  details.trouble > summary { color: var(--warn); }
  details > .inner { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  details ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

  /* რეცეპტის რედაქტორი: თითო მარცვალი/სვია — ცალკე ბლოკი */
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr 1fr 5.5rem; gap: 8px; align-items: end; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; }
  .item .nm { grid-column: 1 / -1; }
  .item .nm2 { grid-column: 1 / 3; }
  .item .icon-btn { width: 100%; min-width: 0; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(255,255,255,.25); }
  .beer-hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .item .icon-btn { color: var(--faint); background: transparent; border-color: var(--line); }
  .hint { font-size: var(--t-sm); color: var(--muted); }

  /* სიგნალი და დიალოგი */
  #overlay, #modal { position: fixed; inset: 0; z-index: 50; display: none; }
  #overlay.on, #modal.on { display: flex; }
  #overlay { background: var(--bg); flex-direction: column; justify-content: center; gap: 18px; padding: calc(24px + env(safe-area-inset-top, 0px)) var(--gutter-r) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  #overlay .ring { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: var(--amber); color: var(--on-amber); animation: pulse 1s ease-in-out infinite; }
  #overlay .ring .ic { width: 48px; height: 48px; }

const SUGAR_G_PER_L = 5.5;        // ჩამოსხმის შაქარი, გ/ლ
const BITTER_HIGH_G_PER_L = 2.75; // სიმწარის ზღვარი (სვია გ/ლ)
const MASH_WATER_L_PER_KG = 3;    // გაშაქრების წყალი, ლ/კგ მარცვალზე
const COOL_MAX_T = 32;            // გაცივების ზღვარი, °C
const FERM_DAYS = [1, 2, 3, 5, 7, 9];
const FG_DAYS = { 7: 'FG #1', 9: 'FG #2' };

/* ჩაშენებული რეცეპტები. სტაუტის ციფრები placeholder-ია — შეცვალე „რეცეპტებში".
   grains[].minute = გაშაქრების რომელ წუთზე ჩაიყაროს (0 = თავიდან).
   hops[].minute   = რამდენი წუთი რჩება ხარშვის ბოლომდე (60 = დასაწყისში). */
const DEFAULT_RECIPES = [
  {

    yeast: { name: 'M12 Kveik', grams: 3, tempMin: 20, tempMax: 30 },
    mashTemp: 70, mashMin: 60, boilMin: 60,

    targetBrix: 14, maxVolumeL: 4.0, autoScale: true
  },
  {
    id: 'stout', name: 'სტაუტი', style: 'Stout',
    grains: [{ name: 'Pilsner', grams: 1000, minute: 0 }, { name: 'Black', grams: 100, minute: 45 }],
    hops: [{ name: 'Perle', grams: 6, minute: 60 }, { name: 'Perle', grams: 5, minute: 5 }],
    yeast: { name: 'M44', grams: 3, tempMin: 18, tempMax: 24 },
    mashTemp: 68, mashMin: 60, boilMin: 60,
    mashWaterL: 3.3, spargeWaterL: 1.5,
    targetBrix: 14, maxVolumeL: 4.0, autoScale: true
  }
];

const INVENTORY = [
  'ქვაბი (5 ლ)', 'BIAB ტომარა', 'ნიჩაბი', 'ციფრული თერმომეტრი',
  'მეორე ქვაბი ჩამორეცხვისთვის', 'ჯამი ტომრისთვის',
  'ფერმენტერი + თავსახური + grommet + საკეტი', 'ძაბრი + საცერი',
  'ცილინდრი (250 მლ) + არეომეტრი', 'ჭიქა ნიმუშისთვის', 'სასწორი', 'საზომი დოქი',
  'სპირტი 70% სპრეი', 'ზეჟანგი 3%', 'მაკრატელი', 'ყინული', 'ლანგარი ფერმენტერისთვის'
];

const SANITIZE = [
  'ფერმენტერი: 0.5 ლ ზეჟანგი, შეანჯღრიე, 5–10 წთ, გადაღვარე',
  'სპირტით: თავსახური', 'სპირტით: grommet', 'სპირტით: საკეტი',
  'სპირტით: ძაბრი', 'სპირტით: საცერი', 'სპირტით: ცილინდრი', 'სპირტით: არეომეტრი',
  'სპირტით: ჭიქა', 'სპირტით: თერმომეტრის წვერი', 'სპირტით: მაკრატელი',
  'სპირტით: საფუარის პაკეტი გარედან', 'ნიჟარაში ყინულიანი წყალი მოამზადე'
];

const BOTTLING_CHECKS = [
  'ფერმენტერი 2 დღე მაცივარში (cold crash)',
  'შაქარი ცხელ წყალში (50 მლ) გახსენი',
  'სიროფი საერთო ჭურჭელში ჩაასხი',
  'სიფონი წყლით გავარჯიშე',
  'ფერმენტერი 40–50 სმ მაღლა დადგი',
  'ბოთლები და თავსახურები სპირტით',
  'ჩამოასხი (ბოთლში 2–3 სმ ჰაერი დატოვე)',
  'ბოთლები ოთახში 14 დღე',

];

/* ეტაპები: თითოს თავისი ფერი, ხატულა და მოკლე შესავალი */
const STAGES = [
  { letter: 'ა', name: 'მომზადება', icon: 'scale', color: '#c3a6ff', intro: 'ყველაფერი ხელთ გქონდეს — და დავიწყოთ.' },
  { letter: 'ბ', name: 'გაშაქრება', icon: 'pot', color: '#f6a823', intro: 'სახამებელი შაქრად იქცევა.' },
  { letter: 'გ', name: 'ჩამორეცხვა', icon: 'drop', color: '#4fd1c5', intro: 'ბოლო ტკბილ წვეთამდე.' },
  { letter: 'დ', name: 'ხარშვა', icon: 'flame', color: '#ff6b4a', intro: 'სვიის დრო!' },
  { letter: 'ე', name: 'გაცივება', icon: 'snow', color: '#67d4ff', intro: 'სწრაფად და სუფთად.' },
  { letter: 'ვ', name: 'გაზომვა და განზავება', icon: 'hydro', color: '#ff9ec7', intro: 'ციფრები, რომლებიც ლუდის ხასიათს წყვეტს.' },
  { letter: 'ზ', name: 'საფუარი', icon: 'yeast', color: '#8fe07a', intro: 'საფუარი სამუშაოდ ემზადება.' },
  { letter: 'თ', name: 'დასრულება', icon: 'glass', color: '#ffd34d', intro: 'თითქმის ლუდია!' }
];

/* მარცვალი: თავიდან ჩასაყრელი და გვიანი დამატებები (მაგ. Black 45-ე წუთზე) */
const grainMin = g => Math.max(0, +g.minute || 0);
const startGrains = r => r.grains.filter(g => grainMin(g) === 0);
const lateGrains = r => r.grains.filter(g => grainMin(g) > 0 && grainMin(g) < r.mashMin).sort((a, b) => grainMin(a) - grainMin(b));
/* სიგნალის დროს მომხმარებელი სავარაუდოდ რომელ ნაბიჯზეა */
const mashStepAt = (r, minute) => minute < r.mashMin / 2 ? 's9' : (r.mashMin - minute > 10 ? 's10' : 's11');

/* ტაიმერები. alerts[].at = რამდენი წუთი რჩება, როცა სიგნალი ირთვება. */
const TIMERS = {
  mash: {
    label: 'გაშაქრება',
    minutes: r => r.mashMin,
    alerts: r => [
      ...lateGrains(r).map(g => ({ at: r.mashMin - grainMin(g), msg: `ჩაყარე ${g.grams} გ ${g.name} და კარგად მოურიე`, step: mashStepAt(r, grainMin(g)) })),
      { at: r.mashMin / 2, msg: 'შუა გაშაქრება: მოურიე და გაზომე ტემპერატურა', step: 's10' },
      ...(r.mashMin > 10 ? [{ at: 10, msg: `ჩამორეცხვის წყალი ${r.spargeWaterL} ლ გააცხელე 77°C-მდე`, step: 's11' }] : []),
      { at: 0, msg: 'გაშაქრება დასრულდა! ტომარა ასწიე', step: 's12' }
    ].sort((a, b) => b.at - a.at)
  },
  boil: {
    label: 'ხარშვა',
    minutes: r => r.boilMin,

/* --- ლუდის ფერი: მარცვლის EBC → SRM (Morey) → ფერი --- */
// სახელის ნაწილი → ტიპური EBC. თანმიმდევრობა მნიშვნელოვანია (უფრო კონკრეტული პირველი).
const MALT_EBC = [
  ['black', 1300], ['carafa', 1100], ['roast', 1100], ['choc', 900], ['შავ', 1300],
  ['caramunich', 110], ['carared', 50], ['caraamber', 70], ['carapils', 4], ['carafoam', 4], ['carahell', 25],
  ['crystal', 120], ['cara', 50], ['melanoidin', 70], ['biscuit', 50], ['munich', 18], ['vienna', 8],
  ['wheat', 4], ['weizen', 4], ['oat', 3], ['rye', 6], ['pils', 3.5], ['pale', 6]
];
const SRM_HEX = ['#FFE699', '#FFD878', '#FFCA5A', '#FFBF42', '#FBB123', '#F8A600', '#F39C00', '#EA8F00', '#E58500', '#DE7C00',
  '#D77200', '#CF6900', '#CB6200', '#C35900', '#BB5100', '#B54C00', '#B04500', '#A63E00', '#A13700', '#9B3200',
  '#952D00', '#8E2900', '#882300', '#821E00', '#7B1A00', '#771900', '#701400', '#6A0E00', '#660D00', '#5E0B00',
  '#5A0A02', '#600903', '#520907', '#4C0505', '#470606', '#440607', '#3F0708', '#3B0607', '#3A070B', '#36080A'];
function guessEbc(name) {
  const n = String(name || '').toLowerCase();
  const hit = MALT_EBC.find(([k]) => n.includes(k));
  return hit ? hit[1] : 6;
}
const ebcOf = g => (g.ebc != null && g.ebc !== '' && isFinite(+g.ebc)) ? +g.ebc : guessEbc(g.name);
function beerSrm(r) {
  const gal = (r.maxVolumeL || 4) / 3.785;
  const mcu = r.grains.reduce((s, g) => s + (+g.grams || 0) / 453.6 * ((ebcOf(g) / 1.97 + 0.76) / 1.3546), 0) / gal;
  return mcu > 0 ? 1.4922 * mcu ** 0.6859 : 2;
}
const srmHex = srm => SRM_HEX[clamp(Math.round(srm), 1, 40) - 1];
const beerColor = r => srmHex(beerSrm(r));
function colorName(srm) {
  return srm < 3 ? 'ღია ჩალისფერი' : srm < 5 ? 'ჩალისფერი' : srm < 7 ? 'ოქროსფერი' : srm < 11 ? 'ქარვისფერი'

}

/* რეფრაქტომეტრის კორექცია (Terrill), ალკოჰოლის არსებობისას */
function refractFG(ogBrix, fgBrix, wcf = 1.04) {
  const ob = ogBrix / wcf, fb = fgBrix / wcf;
  return 1 - 0.0044993 * ob + 0.011774 * fb + 0.00027581 * ob * ob - 0.0012717 * fb * fb
    - 0.0000072800 * ob ** 3 + 0.000063293 * fb ** 3;
}

function toast(text, html = false) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  if (html) t.innerHTML = text; else t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), html ? 3200 : 2400);
}

  }).join('');
  p.innerHTML = `${conf}<div class="fillup">${glassSvg(color, 0.9, 120)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p>
    <button class="primary" id="partyGo">${esc(btnLabel)}</button><button class="ghost" id="partyClose">დახურვა</button>`;
  p.classList.add('on');
  if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 120]);
  const close = () => { p.classList.remove('on'); p.innerHTML = ''; };
  $('#partyGo').onclick = () => { close(); go(href); };
  $('#partyClose').onclick = close;
}

/* დადასტურების ფანჯარა (confirm()-ის ნაცვლად) */
function ask(text, okLabel = 'დიახ', danger = false) {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="sheet"><p>${esc(text)}</p>
      <button class="${danger ? 'danger' : 'primary'}" id="askOk">${esc(okLabel)}</button>
      <button class="ghost" id="askNo">გაუქმება</button></div>`;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); m.innerHTML = ''; resolve(v); };
    $('#askOk').onclick = () => close(true);
    $('#askNo').onclick = () => close(false);
    m.onclick = e => { if (e.target === m) close(false); };
    $('#askOk').focus();
  });
}

/* =====================================================================
   4. მონაცემები (localStorage)
   ===================================================================== */
let S = load();

function freshState() {
  return { recipes: clone(DEFAULT_RECIPES), batches: [], settings: { debug: false, wake: true } };
}
function migrate(s) {
  s = s && typeof s === 'object' ? s : {};
  s.recipes = Array.isArray(s.recipes) && s.recipes.length ? s.recipes : clone(DEFAULT_RECIPES);
  s.batches = Array.isArray(s.batches) ? s.batches : [];
  s.settings = Object.assign({ debug: false, wake: true }, s.settings || {});
  s.recipes.forEach(fixRecipe);
  s.batches.forEach(b => {
    Object.assign(b, Object.assign({
      readings: {}, stepsDone: {}, checks: {}, timers: {}, cur: 0, fermentationLog: [],
      instrument: 'hydro', notes: '', status: 'planned', created: Date.now()
    }, b));
    b.bottling = Object.assign({ fg: null, volume: null, sugar: null, bottles: null, date: '', tasting: '' }, b.bottling || {});
    if (b.recipe) fixRecipe(b.recipe);
  });
  return s;
}
function fixRecipe(r) {
  r.grains = r.grains || []; r.hops = r.hops || [];
  r.grains.forEach(g => {
    // ძველი შენახული სტაუტი: Black ჩაიყრება 45-ე წუთზე
    if (g.minute == null) g.minute = (r.id === 'stout' && g.name === 'Black') ? 45 : 0;
  });
  r.yeast = Object.assign({ name: '', grams: 2, tempMin: 18, tempMax: 24 }, r.yeast || {});
  if (r.autoScale == null) r.autoScale = true;
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn(e); }
  return freshState();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
  catch (e) { toast('შენახვა ვერ მოხერხდა — მეხსიერება სავსეა?'); }
}

const getBatch = id => S.batches.find(b => b.id === id);
const getRecipe = id => S.recipes.find(r => r.id === id);
/* ხარშვის დაწყებისას რეცეპტი პარტიაში კოპირდება; ასლი ცალკე რედაქტირდება */
const recipeOf = b => b.recipe || getRecipe(b.recipeId) || S.recipes[0];
function val(b, k) { const r = b.readings[k]; return r ? r.value : null; }
function brewDay(b) { return b.stepsDone.s26 ? todayStr(new Date(b.stepsDone.s26)) : b.date; }

/* =====================================================================
   5. გამოთვლები
   ===================================================================== */
function calc(b, r) {
  const pot = val(b, 'potVol'), brix = val(b, 'brix'), ml = val(b, 'sampleMl') || 0;
  const c = { ready: false };
  if (pot == null || brix == null || brix <= 0) return c;
  const wortL = pot - ml / 1000;
  if (wortL <= 0) return c;
  const idealL = wortL * brix / r.targetBrix;
  const finalL = Math.min(idealL, r.maxVolumeL);
  const vol = Math.max(finalL, wortL);              // Brix სამიზნეზე დაბალია → არ ვაზავებთ
  const addL = vol - wortL;
  const finalBrix = brix * wortL / vol;
  const og = sgFromBrix(finalBrix);
  const hopG = r.hops.reduce((s, h) => s + (+h.grams || 0), 0);
  const bitter = hopG / vol;
  const alts = [1, 2, 3].map(d => {
    const tb = r.targetBrix - d;
    const L = wortL * brix / tb;
    return { tb, L, add: L - wortL, og: sgFromBrix(tb), abv: (sgFromBrix(tb) - 1.010) * 131, over: L > r.maxVolumeL };
  }).filter(a => a.tb > 0 && a.add > 0);
  return {
    ready: true, wortL, brix, idealL, finalL, vol, addL, finalBrix, og,
    abv: (og - 1.010) * 131, hopG, bitter, bitterHigh: bitter > BITTER_HIGH_G_PER_L,
    capped: idealL > r.maxVolumeL, lowEff: (idealL - wortL) < 0.3, belowTarget: brix < r.targetBrix, alts
  };
}

function mashGauge(r, k) { return { k, lo: r.mashTemp - 1, hi: r.mashTemp + 2, min: r.mashTemp - 10, max: r.mashTemp + 10, unit: '°C' }; }
function mashFeedback(r, t) {
  if (t == null) return [];
  if (t < r.mashTemp - 1) return [{ cls: 'warn', text: `დაბალია (${fmt(t)}°C): დაბალ ცეცხლზე, ურიე, ${r.mashTemp}°C-ზე გამორთე.` }];
  if (t > r.mashTemp + 2) return [{ cls: 'warn', text: `მაღალია (${fmt(t)}°C): თავსახური ღია, ურიე, ან 50–100 მლ ცივი წყალი.` }];
  return [{ cls: 'ok', text: `კარგია — სამიზნე ${r.mashTemp}°C.` }];
}

function yeastSuggest(r, b, c) {
  const v = val(b, 'finalVol') || (c.ready ? c.vol : null);
  return v ? Math.max(2, Math.round(v)) : Math.max(2, r.yeast.grams);
}

/* დადუღების გამოთვლები: OG, ბოლო FG, ABV, დასრულდა თუ არა */
function fermStats(b) {
  const r = recipeOf(b), c = calc(b, r);
  const fgs = b.fermentationLog.filter(e => e.fg != null).sort((a, z) => a.day - z.day);
  const last = fgs[fgs.length - 1], prev = fgs[fgs.length - 2];
  const st = { og: c.ready ? c.og : null, ogBrix: c.ready ? c.finalBrix : null, fgBrix: last ? last.fg : null };
  if (st.fgBrix != null) {
    st.fgSG = b.instrument === 'refract' && st.ogBrix != null ? refractFG(st.ogBrix, st.fgBrix) : sgFromBrix(st.fgBrix);
    if (st.og != null) st.abv = (st.og - st.fgSG) * 131;
  }
  st.finished = !!(last && prev && last.fg === prev.fg);
  st.fgCount = fgs.length;
  return st;
}

/* რეცეპტის შემოწმება რედაქტორისთვის */
function recipeIssues(r) {
  const out = [];
  if (!r.grains.length) out.push('მარცვალი არ არის.');
  if (r.grains.length && !startGrains(r).length) out.push('ერთი მარცვალი მაინც 0-ე წუთზე უნდა ჩაიყაროს.');
  r.grains.forEach(g => { if (grainMin(g) >= r.mashMin) out.push(`${g.name || 'მარცვალი'} ${grainMin(g)}-ე წუთზე — გაშაქრება ${r.mashMin} წთ-ია, ვერ ჩაიყრება.`); });
  r.hops.forEach(h => { if (h.minute > r.boilMin) out.push(`${h.name || 'სვია'} @${h.minute} წთ — ხარშვაზე (${r.boilMin} წთ) მეტია; ჩაიყრება დასაწყისში.`); });
  if (r.yeast.tempMin >= r.yeast.tempMax) out.push('საფუარის მინ. ტემპერატურა მაქსიმუმზე ნაკლები უნდა იყოს.');
  if (r.mashWaterL > POT_SAFE_L) out.push(`გაშაქრების წყალი ${r.mashWaterL} ლ — 5 ლ ქვაბისთვის ბევრია.`);
  if (r.maxVolumeL > POT_L) out.push(`მაქს. მოცულობა ${r.maxVolumeL} ლ ფერმენტერს (5 ლ) აჭარბებს.`);
  return out;
}

/* =====================================================================
   6. ტაიმერები, ხმა, შეტყობინებები, Wake Lock
   ===================================================================== */
let actx = null, beepTimeout = null;
const alertQueue = [];

function ensureAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { /* ხმა მიუწვდომელია */ }
}
/* სამი სერია სამ-სამი ბიპით (Web Audio, გარე ფაილის გარეშე) */
function playAlarm() {
  stopAlarm();
  let round = 0;
  const play = () => {
    if (actx) {
      const t0 = actx.currentTime;
      for (let k = 0; k < 3; k++) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = k === 2 ? 1320 : 990;
        g.gain.setValueAtTime(0.0001, t0 + k * 0.28);
        g.gain.exponentialRampToValueAtTime(0.5, t0 + k * 0.28 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + k * 0.28 + 0.2);
        o.connect(g).connect(actx.destination);
        o.start(t0 + k * 0.28); o.stop(t0 + k * 0.28 + 0.22);
      }
    }
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    if (++round < 3) beepTimeout = setTimeout(play, 1600);
  };
  play();
}
function stopAlarm() { clearTimeout(beepTimeout); beepTimeout = null; if (navigator.vibrate) navigator.vibrate(0); }

function askNotify() {
  if ('Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) { /* ignore */ }
  }
}
function notify(text) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('ხარშვის ასისტენტი', { body: text, tag: 'brew', renotify: true }); } catch (e) { /* ignore */ }
  }
}

function startTimer(b, id) {
  ensureAudio(); askNotify();
  const min = TIMERS[id].minutes(recipeOf(b));
  const unit = S.settings.debug ? DEBUG_TIMER_MS / min : 60000;   // ms ერთ "წუთზე"
  b.timers[id] = { startedAt: Date.now(), endAt: Date.now() + min * unit, unit, minutes: min, paused: false, rem: null, fired: [], done: false };
  save();
}
const remaining = t => t.paused ? t.rem : t.endAt - Date.now();
function togglePause(t) {
  if (t.paused) { t.endAt = Date.now() + t.rem; t.paused = false; t.rem = null; }
  else { t.rem = t.endAt - Date.now(); t.paused = true; }
}
function adjustTimer(b, id, dMin) {
  const t = b.timers[id];
  const d = dMin * t.unit;
  if (t.paused) t.rem = Math.max(0, t.rem + d);
  else t.endAt = Math.max(Date.now(), t.endAt + d);
  // თუ დრო დაემატა, სიგნალები, რომლებიც ჯერ არ უნდა მომხდარიყო, თავიდან აქტიურდება
  const rem = remaining(t);
  const alerts = TIMERS[id].alerts(recipeOf(b));
  t.fired = t.fired.filter(key => { const a = alerts.find(x => alertKey(x) === key); return a && rem <= a.at * t.unit; });
  if (rem > 0) t.done = false;
}
const alertKey = a => `${a.at}|${a.msg}`;

/* ყოველ 0.5 წამში: ტაიმერების შემოწმება და ეკრანის განახლება */
function tick() {
  let changed = false;
  for (const b of S.batches) {
    for (const id in b.timers) {
      const t = b.timers[id];
      if (!t || t.done || !TIMERS[id]) continue;
      const rem = remaining(t);
      for (const a of TIMERS[id].alerts(recipeOf(b))) {
        const key = alertKey(a);
        if (!t.fired.includes(key) && rem <= a.at * t.unit) {
          t.fired.push(key); changed = true;
          pushAlert({ batchId: b.id, msg: a.msg, step: a.step, label: TIMERS[id].label });
        }
      }
      if (rem <= 0 && !t.paused) { t.done = true; changed = true; }
    }
  }
  if (changed) save();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const [bid, id] = el.dataset.timer.split(':');
    const b = getBatch(bid); const t = b && b.timers[id];
    if (!t) return;
    const rem = remaining(t), total = t.minutes * t.unit;
    if (el.classList.contains('digits')) {
      el.textContent = fmtMs(rem);
      el.classList.toggle('paused', !!t.paused);
      el.classList.toggle('over', rem <= 0);
    } else if (el.tagName === 'I') {
      el.style.width = `${clamp(100 - rem / total * 100, 0, 100)}%`;
    } else if (changed && el.classList.contains('alerts')) {
      el.innerHTML = alertsHtml(b, id);
    }
  });
}

function pushAlert(a) {
  alertQueue.push(a);
  notify(a.msg);
  playAlarm();
  renderOverlay();
}
function renderOverlay() {
  const o = $('#overlay');
  const a = alertQueue[0];
  if (!a) { o.classList.remove('on'); o.innerHTML = ''; return; }
  o.innerHTML = `
    <div class="ring">${ic('timer')}</div>
    <div class="cap">${esc(a.label)}${alertQueue.length > 1 ? ` · კიდევ ${alertQueue.length - 1} სიგნალი` : ''}</div>
    <div class="big">${esc(a.msg)}</div>
    <button class="primary" data-act="alertGo">ნაბიჯზე გადასვლა ${ic('chev')}</button>
    <button data-act="alertMute">${ic('check')} გასაგებია, გაჩუმება</button>`;
  o.classList.add('on');
}

let wakeLock = null;
async function applyWake() {
  const want = S.settings.wake && route().name === 'brew' && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* =====================================================================
   7. საერთო კომპონენტები
   ===================================================================== */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  return { name: parts[0] || 'home', id: parts[1] };
}

const pill = s => `<span class="pill ${s}">${STATUS[s] || s}</span>`;
const debugTag = () => S.settings.debug ? ' <span class="debug">DEBUG</span>' : '';

function tabbar(on) {
  const t = (h, n, icon, l) => `<a href="${h}" class="${on === n ? 'on' : ''}" ${on === n ? 'aria-current="page"' : ''}>${ic(icon)}<span>${l}</span></a>`;
  return `<nav class="tabbar" aria-label="მთავარი"><div class="wrap">
    ${t('#/', 'home', 'mug', 'პარტიები')}${t('#/recipes', 'recipes', 'book', 'რეცეპტები')}${t('#/settings', 'settings', 'sliders', 'პარამეტრები')}
  </div></nav>`;
}
function appbar(title, backHref, extra = '') {
  return `<header class="appbar"><div class="wrap">
    ${backHref ? `<a class="btn icon-btn" href="${backHref}" aria-label="უკან">${ic('back')}</a>` : ''}
    <div class="ttl">${title}</div>${extra}
  </div></header>`;
}
function listRow(href, icon, title, sub, act) {
  const inner = `${ic(icon, 'lead')}<span class="body"><span class="title">${title}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${ic('chev', 'chev')}`;
  return href ? `<a class="list-row" href="${href}">${inner}</a>` : `<button type="button" class="list-row" data-act="${act}">${inner}</button>`;
}
function checklistHtml(key, items, b, title = 'ჩეკლისტი') {
  const done = items.filter((_, k) => b.checks[key] && b.checks[key][k]).length;
  return `<section class="panel"><div class="sec-head" style="margin:0"><h3>${esc(title)}</h3><span class="num small muted" id="cnt-${key}" data-total="${items.length}">${done}/${items.length}</span></div>
    <div class="checks">${items.map((t, k) => {
      const on = b.checks[key] && b.checks[key][k];
      return `<label class="check ${on ? 'done' : ''}"><input type="checkbox" id="ck-${key}-${k}" data-bind="check:${key}:${k}" ${on ? 'checked' : ''}><span>${esc(t)}</span></label>`;
    }).join('')}</div></section>`;
}
function unitInput(attrs, value, unit) {
  if (!unit) return `<input inputmode="decimal" autocomplete="off" class="num" ${attrs} value="${esc(value)}">`;
  return `<span class="unit-in"><input inputmode="decimal" autocomplete="off" ${attrs} value="${esc(value)}"><span>${esc(unit)}</span></span>`;
}

/* შემდეგი მოქმედება პარტიის ბარათზე */
function batchNext(b) {
  const today = todayStr();
  switch (b.status) {
    case 'planned': return { text: `დაგეგმილი: ${fmtDate(b.date)}`, pct: 0 };
    case 'brewing': return { text: `ნაბიჯი ${b.cur + 1}/${STEPS.length} · ${STEPS[b.cur].title}`, pct: (b.cur + 1) / STEPS.length * 100 };
    case 'fermenting': {
      const d = daysBetween(brewDay(b), today);
      const next = FERM_DAYS.find(x => x >= d);
      return { text: `დადუღება · დღე ${Math.max(d, 0)}${next != null ? ` · ჩანაწერი: დღე ${next}` : ' · დროა FG-ს'}`, pct: clamp(d / 11 * 100, 0, 100) };
    }
    case 'bottled': return { text: b.bottling.date ? `ჩამოსხმული ${fmtDate(b.bottling.date)} · გემო ${fmtDate(addDays(b.bottling.date, 14))}` : 'ჩამოსხმული', pct: 100 };
    default: return { text: 'დასრულებული', pct: 100 };
  }
}
/* ჭიქის შევსება = პარტიის პროგრესი */
function batchFill(b) {
  return { planned: 0.1, brewing: 0.12 + 0.55 * (b.cur / STEPS.length), fermenting: 0.8, bottled: 0.92, done: 0.92 }[b.status] ?? 0.5;
}
const grainLabel = g => `${esc(g.name)} ${g.grams} გ${grainMin(g) > 0 ? ` <span class="tag">${grainMin(g)}-ე წთ</span>` : ''}`;

/* =====================================================================
   8. ეკრანები
   ===================================================================== */

/* --- 8.1 პარტიების სია --- */
function viewHome() {
  const list = S.batches.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
  const active = list.find(b => b.status === 'brewing');

  const liters = S.batches.reduce((s, b) => s + (val(b, 'finalVol') || 0), 0);

  const heroBatch = active || list.find(b => b.status === 'fermenting') || list[0];
  const heroColor = heroBatch ? beerColor(recipeOf(heroBatch)) : srmHex(6);
  return `<main class="wrap">
    <section class="hero">
      <div>
        <span class="hi">${hello}, მეხარშევ!${debugTag()}</span>
        <h1>შენი პატარა სახარში</h1>
        <div class="stats">
          <span><b>${S.batches.length}</b> პარტია</span>
          <span><b>${fmt(liters)}</b> ლ ლუდი</span>
          ${inFerm ? `<span><b>${inFerm}</b> დუღს ახლა</span>` : ''}
        </div>
      </div>
      ${glassSvg(heroColor, heroBatch ? batchFill(heroBatch) : 0.85, 72)}
    </section>
    ${active ? `<section class="panel hl">
      <div class="sec-head" style="margin:0"><span class="eyebrow">${ic('flame')} ახლა იხარშება</span>${pill('brewing')}</div>
      <h2>${esc(active.name)}</h2>
      <p class="muted small">${esc(batchNext(active).text)}</p>
      ${timers.map(id => `<div class="btn-row" style="align-items:center"><span class="muted" style="display:flex;gap:8px;align-items:center">${ic('timer')} ${TIMERS[id].label}</span><span class="digits mini" data-timer="${active.id}:${id}">--:--</span></div>`).join('')}
      <a class="btn primary" href="#/brew/${active.id}">${ic('flame')} გაგრძელება</a>
    </section>` : ''}
    <a class="btn ${active ? '' : 'primary'}" href="#/new">${ic('plus')} ახალი პარტია</a>
    ${list.length ? `<section class="sec"><div class="sec-head"><h2>${ic('mug')} პარტიები</h2><span class="muted small num">${list.length}</span></div>
      ${list.map(b => { const n = batchNext(b), r = recipeOf(b); return `
      <a class="batch card-glass" href="#/batch/${b.id}">
        ${glassSvg(beerColor(r), batchFill(b), 40, b.status === 'fermenting' || b.status === 'brewing')}
        <div class="body">
          <div class="top"><span class="name">${esc(b.name)}</span>${pill(b.status)}</div>
          <div class="muted small">${esc(r.name)} · ${fmtDate(b.date)}</div>
          <div class="small">${esc(n.text)}</div>
        </div>
      </a>`; }).join('')}</section>`
    : `<div class="empty">${glassSvg(srmHex(6), 0.85, 96)}<h2 style="color:var(--fg)">პირველი პარტია გელოდება</h2>
        <p>აირჩიე რეცეპტი და ხარშვის დღეს აპი ნაბიჯ-ნაბიჯ გაგიძღვება — ტაიმერებით, ჩეკლისტებით და განზავების კალკულატორით.</p>
        <a class="btn primary" href="#/new">${ic('plus')} დავიწყოთ</a></div>`}
  </main>${tabbar('home')}`;
}

/* --- 8.2 ახალი პარტია --- */
function viewNew() {
  const n = S.batches.length + 1;
  return `${appbar('ახალი პარტია', '#/')}<main class="wrap enter">
    <div class="sec"><span class="lbl muted small" style="font-weight:600">რას მოვხარშავთ?</span>
      <input type="hidden" id="nb-recipe" value="${S.recipes[0].id}">
      <div class="picker" role="radiogroup">${S.recipes.map((r, i) => { const srm = beerSrm(r); return `
        <button type="button" class="pick ${i === 0 ? 'on' : ''}" role="radio" aria-checked="${i === 0}" data-act="pickRecipe" data-id="${r.id}">
          ${glassSvg(srmHex(srm), 0.85, 48)}<span>${esc(r.name)}</span><small>${colorName(srm)} · Brix ${r.targetBrix}</small></button>`; }).join('')}</div></div>
    <label class="field"><span class="lbl">სახელი</span><input id="nb-name" value="${esc(S.recipes[0].name)} #${S.batches.filter(b => b.recipeId === S.recipes[0].id).length + 1}" data-last="${esc(S.recipes[0].name)} #${S.batches.filter(b => b.recipeId === S.recipes[0].id).length + 1}"></label>
    <label class="field"><span class="lbl">ხარშვის თარიღი</span><input id="nb-date" type="date" value="${todayStr()}"></label>
    <button class="primary" data-act="createBatch">${ic('plus')} შექმნა</button>
  </main>${tabbar('home')}`;
}

/* --- 8.3 პარტიის გვერდი --- */
function viewBatch(b) {
  const r = recipeOf(b), c = calc(b, r);
  const started = Object.keys(b.stepsDone).length > 0 || b.status !== 'planned';
  const timers = Object.keys(b.timers).filter(id => b.timers[id] && !b.timers[id].done);
  const fs = fermStats(b);
  const main = {
    planned: ['openBrew', 'flame', 'ხარშვის დაწყება'],
    brewing: ['openBrew', 'flame', `ხარშვის გაგრძელება · ${b.cur + 1}/${STEPS.length}`],
    fermenting: ['goFerm', 'bubbles', 'დადუღების დღიური'],
    bottled: ['goBottle', 'bottle', 'ჩამოსხმა და გემო'],
    done: ['goExport', 'doc', 'ექსპორტი']
  }[b.status] || ['openBrew', 'flame', 'ხარშვის დღე'];
  const editHref = b.recipe ? `#/brecipe/${b.id}` : `#/recipe/${r.id}`;
  return `${appbar(esc(b.name), '#/')}<main class="wrap enter">
    <div class="card-glass">
      ${glassSvg(beerColor(r), batchFill(b), 56, b.status === 'fermenting' || b.status === 'brewing')}
      <div class="body">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill(b.status)}<span class="muted small">${fmtDate(b.date)}</span></div>
        <p class="muted">${esc(batchNext(b).text)}</p>
        <div class="meter" aria-hidden="true"><div style="width:${batchNext(b).pct}%"></div></div>
      </div>
    </div>
    ${timers.map(id => `<section class="panel hl timer"><div class="head"><span class="lbl">${ic('timer')} ${TIMERS[id].label}</span></div>
      <div class="digits" data-timer="${b.id}:${id}">--:--</div></section>`).join('')}
    <button class="primary" data-act="${main[0]}">${ic(main[1])} ${main[2]}</button>
    ${fs.abv != null || c.ready ? `<div class="tiles">
      <div class="tile"><span class="k">OG</span><span class="v">${fs.og ? fs.og.toFixed(3) : '—'}</span></div>
      <div class="tile"><span class="k">FG</span><span class="v">${fs.fgSG ? fs.fgSG.toFixed(3) : '—'}</span></div>
      <div class="tile"><span class="k">ABV</span><span class="v">${fs.abv != null ? fmt(fs.abv) + '%' : '~' + fmt(c.abv) + '%'}</span></div>
    </div>` : ''}
    <nav class="list">
      ${listRow(null, 'flame', 'ხარშვის დღე', started ? `ნაბიჯი ${b.cur + 1} / ${STEPS.length}` : '26 ნაბიჯი, 8 ეტაპი', 'openBrew')}
      ${listRow(`#/ferm/${b.id}`, 'bubbles', 'დადუღების დღიური', fs.finished ? 'FG სტაბილურია' : `დღეები ${FERM_DAYS.join(', ')}`)}
      ${listRow(`#/bottle/${b.id}`, 'bottle', 'ჩამოსხმა', b.bottling.volume ? `${b.bottling.volume} ლ · შაქარი ${fmt(b.bottling.volume * SUGAR_G_PER_L)} გ` : 'შაქარი, ჩეკლისტი, გემო')}
      ${listRow(`#/export/${b.id}`, 'doc', 'ექსპორტი', 'Markdown — კოპირება')}
    </nav>

    <section class="sec">
      <div class="sec-head"><h2>${ic('book')} რეცეპტი</h2></div>
      <a class="batch" href="${editHref}" aria-label="რეცეპტის რედაქტირება">
        <div class="top"><span class="name" style="font-size:var(--t-md)">${esc(r.name)}</span>${ic('edit')}</div>
        <div class="small muted">${r.grains.map(grainLabel).join(' · ')}</div>
        <div class="small muted">${r.hops.map(h => `${esc(h.name)} ${h.grams} გ @${h.minute}`).join(' · ')} · ${esc(r.yeast.name)}</div>
        <div class="small muted">${r.mashTemp}°C × ${r.mashMin} წთ · ხარშვა ${r.boilMin} წთ · Brix ${r.targetBrix}</div>
      </a>
      ${b.recipe ? '<p class="small muted">ხარშვის დაწყებისას რეცეპტი ამ პარტიაში დაკოპირდა. მისი ცვლილება ბიბლიოთეკის რეცეპტს არ ეხება.</p>'
        : `<label class="field"><span class="lbl">სხვა რეცეპტის არჩევა</span><select id="b-recipe" data-bind="batch:recipeId">${S.recipes.map(x => `<option value="${x.id}" ${x.id === b.recipeId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`}
    </section>

    <section class="sec">
      <h2>დეტალები</h2>
      <label class="field"><span class="lbl">სახელი</span><input id="b-name" data-bind="batch:name" value="${esc(b.name)}"></label>
      <div class="grid2">
        <label class="field"><span class="lbl">თარიღი</span><input id="b-date" type="date" data-bind="batch:date" value="${esc(b.date)}"></label>
        <label class="field"><span class="lbl">სტატუსი</span><select id="b-status" data-bind="batch:status">
          ${Object.keys(STATUS).map(s => `<option value="${s}" ${s === b.status ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span class="lbl">შენიშვნები</span><textarea id="b-notes" data-bind="batch:notes" placeholder="რა გამოვიდა კარგად, რას შეცვლი შემდეგ ჯერზე">${esc(b.notes)}</textarea></label>
    </section>

    ${started ? `<details><summary>${ic('list')} ყველა ნაბიჯი${ic('chev', 'chev')}</summary><div class="inner"><div class="checks">${STEPS.map((s, i) => `
      <button type="button" class="list-row" style="min-height:52px;padding:8px 2px" data-act="goStep" data-i="${i}">
        ${ic(b.stepsDone[s.key] ? 'check' : (i === b.cur ? 'chev' : 'minus'), 'lead')}<span class="body"><span>${i + 1}. ${s.title}</span></span></button>`).join('')}</div></div></details>
      <details><summary>${ic('doc')} ხარშვის შეჯამება${ic('chev', 'chev')}</summary><div class="inner">${renderSummary(b)}</div></details>` : ''}
    <button class="danger" data-act="deleteBatch">${ic('trash')} პარტიის წაშლა</button>
  </main>${tabbar('home')}`;
}

/* --- 8.4 ხარშვის რეჟიმი (ნაბიჯ-ნაბიჯ) --- */
function viewBrew(b) {
  const r = recipeOf(b);
  const i = clamp(b.cur, 0, STEPS.length - 1);
  const st = STEPS[i], c = calc(b, r);
  const stage = STAGES[st.stage];
  const done = b.stepsDone[st.key];
  const checks = st.checklist ? st.checklist(r) : [];
  // ეტაპების ზოლი: თითო ეტაპის შიგნით შევსება ნაბიჯების მიხედვით
  const segs = STAGES.map((_, si) => {
    const idx = STEPS.map((s, k) => s.stage === si ? k : -1).filter(k => k >= 0);
    const fill = i > idx[idx.length - 1] ? 100 : i < idx[0] ? 0 : ((i - idx[0] + 1) / idx.length) * 100;
    return `<div><i style="width:${fill}%;background:${STAGES[si].color}"></i></div>`;
  }).join('');
  // გაშვებული ტაიმერი, რომელიც ამ ნაბიჯზე არ ჩანს — პატარა ჩიპად ზედა ზოლში
  const chips = Object.keys(b.timers).filter(id => b.timers[id] && !b.timers[id].done && id !== st.timer)
    .map(id => `<span class="tchip">${ic('timer')}<span class="digits chip-d" data-timer="${b.id}:${id}">--:--</span></span>`).join('');
  const next = STEPS[i + 1];
  return `
  <header class="brewbar" style="--stage:${stage.color}"><div class="wrap">
    <div class="row1">
      <button class="icon-btn" data-act="goBatch" aria-label="პარტიაზე დაბრუნება">${ic('back')}</button>
      <button class="where-btn" data-act="openMap" aria-label="ნაბიჯების რუკა"><span class="eyebrow">${ic('map')} ეტაპი ${st.stage + 1}/${STAGES.length}${debugTag()}</span><b>${stage.letter}. ${stage.name}</b></button>
      ${chips}
      <button class="icon-btn ${S.settings.wake ? 'on' : ''}" data-act="toggleWake" aria-pressed="${S.settings.wake}" aria-label="ეკრანი არ დაიძინოს">${ic(S.settings.wake ? 'sun' : 'moon')}</button>
    </div>
    <div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${i + 1}" data-act="openMap">${segs}</div>
  </div></header>
  <main class="wrap brew enter" style="--stage:${stage.color}">
    <div class="stage-row">
      <div class="stage-disc">${ic(stage.icon)}</div>
      <div class="txt">
        <span class="eyebrow num">ნაბიჯი ${i + 1} / ${STEPS.length}</span>
        <h1>${st.title}</h1>
        ${STEPS.findIndex(s => s.stage === st.stage) === i ? `<span class="intro">${esc(stage.intro)}</span>` : ''}
      </div>
    </div>
    <ul class="instr">${st.lines(r, b, c).map(l => typeof l === 'string'
      ? `<li><span>${esc(l)}</span></li>` : `<li class="${l.later ? 'later' : ''}"><span>${esc(l.text)}</span></li>`).join('')}</ul>
    ${st.custom ? `<div id="custom" class="sec">${st.custom(r, b, c)}</div>` : ''}
    ${(st.inputs || []).map(inp => readingHtml(b, inp)).join('')}
    <div id="live" class="sec">${liveHtml(st, r, b, c)}</div>
    ${checks.length ? checklistHtml(st.checklistKey || st.key, checks, b, st.checklistTitle) : ''}
    ${st.timer ? timerHtml(b, st.timer) : ''}
    ${st.trouble ? `<details class="trouble"><summary>${ic('alert')} თუ რამე ისე არ არის${ic('chev', 'chev')}</summary><div class="inner"><ul>${st.trouble.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></details>` : ''}
    ${done ? `<span class="stamp">${ic('check')} შესრულდა ${fmtTime(done)}</span>` : ''}
    ${next ? `<div class="nextup">${ic('chev')} შემდეგი: <b>${i + 2}. ${next.title}</b></div>` : ''}
  </main>
  <div class="actionbar"><div class="wrap">
    <button class="icon-btn" data-act="stepBack" ${i === 0 ? 'disabled' : ''} aria-label="წინა ნაბიჯი">${ic('back')}</button>
    <button data-act="stepSkip">გამოტოვება</button>
    <button class="primary ${st.gate && st.gate(r, b, c) ? 'gated' : ''}" id="doneBtn" data-act="stepDone">${ic('check')} ${st.doneLabel || 'შესრულდა'}</button>
  </div></div>`;
}

function readingHtml(b, inp) {
  const v = b.readings[inp.k];
  return `<div class="reading">
    <label class="lbl" for="rd-${inp.k}"><span>${inp.label}</span><span id="rdt-${inp.k}" class="num">${v ? fmtTime(v.time) : ''}</span></label>
    <div class="stepper">
      <button type="button" data-act="nudge" data-k="${inp.k}" data-d="-1" aria-label="შემცირება">${ic('minus')}</button>
      ${unitInput(`id="rd-${inp.k}" data-bind="reading:${inp.k}"`, v && v.value != null ? v.value : '', inp.unit)}
      <button type="button" data-act="nudge" data-k="${inp.k}" data-d="1" aria-label="გაზრდა">${ic('plus')}</button>
    </div></div>`;
}

/* სკალა: მწვანე ზოლი = სწორი დიაპაზონი, ხაზი = შენი ციფრი */
function gaugeHtml(g, v) {
  const p = x => clamp((x - g.min) / (g.max - g.min) * 100, 0, 100);
  const inBand = v != null && v >= g.lo && v <= g.hi;
  const lbl = (x, cls = '') => `<span class="${cls}" style="left:${p(x)}%">${fmt(x)}</span>`;
  return `<div class="gauge" aria-hidden="true">
    <div class="track"><div class="band" style="left:${p(g.lo)}%;width:${p(g.hi) - p(g.lo)}%"></div>
      ${v != null ? `<div class="mark ${inBand ? '' : 'out'}" style="left:${p(v)}%"></div>` : ''}</div>
    <div class="scale">${g.lo > g.min ? lbl(g.min, 'start') : ''}${lbl(g.lo, g.lo <= g.min ? 'start' : '')}${lbl(g.hi)}${lbl(g.max, 'end')}</div>
  </div>`;
}

/* ცოცხალი ბლოკი: სკალა, გაფრთხილებები და პირობა გაგრძელებისთვის */
function liveHtml(st, r, b, c) {
  const g = st.gauge ? st.gauge(r) : null;
  const fb = st.feedback ? st.feedback(r, b, c) : [];
  const gate = st.gate ? st.gate(r, b, c) : null;
  return (g ? gaugeHtml(g, val(b, g.k)) : '')
    + fb.map(f => msgHtml(f.cls, f.text)).join('')
    + (gate && !fb.length ? msgHtml('info', gate) : '');
}
function refreshBrewLive(b) {
  const r = recipeOf(b), st = STEPS[b.cur], c = calc(b, r);
  const live = $('#live'); if (live) live.innerHTML = liveHtml(st, r, b, c);
  const btn = $('#doneBtn'); if (btn) btn.classList.toggle('gated', !!(st.gate && st.gate(r, b, c)));
  if ($('#custom') && st.custom) $('#custom').innerHTML = st.custom(r, b, c);
  (st.inputs || []).forEach(inp => { const el = $(`#rdt-${inp.k}`); const v = b.readings[inp.k]; if (el) el.textContent = v ? fmtTime(v.time) : ''; });
}

function alertsHtml(b, id) {
  const t = b.timers[id], r = recipeOf(b);
  const unit = t ? t.unit : 60000;
  return TIMERS[id].alerts(r).map(a => {
    const fired = t && t.fired.includes(alertKey(a));
    return `<div class="${fired ? 'fired' : ''}"><span class="num">${fmtMs(a.at * unit)}</span><span>${esc(a.msg)}</span></div>`;
  }).join('');
}
function timerHtml(b, id) {
  const t = b.timers[id], r = recipeOf(b), def = TIMERS[id];
  const min = t ? t.minutes : def.minutes(r);
  const marks = def.alerts(r).filter(a => a.at > 0 && a.at < min).map(a => {
    const fired = t && t.fired.includes(alertKey(a));
    return `<b class="${fired ? 'fired' : ''}" style="left:${100 - a.at / min * 100}%"></b>`;
  }).join('');
  const head = `<div class="head"><span class="lbl">${ic('timer')} ${def.label} · ${min} წთ</span>${S.settings.debug ? '<span class="debug">10 წმ</span>' : ''}</div>`;
  if (!t) {
    return `<section class="panel hl timer">${head}
      <div class="digits paused">${fmtMs(min * 60000)}</div>
      <div class="tbar">${marks}</div>
      <div class="alerts">${alertsHtml(b, id)}</div>
      <button class="primary" data-act="timerStart" data-t="${id}">${ic('play')} ტაიმერის დაწყება</button></section>`;
  }
  return `<section class="panel hl timer">${head}
    <div class="digits" data-timer="${b.id}:${id}" role="timer">${fmtMs(remaining(t))}</div>
    <div class="tbar"><i data-timer="${b.id}:${id}" style="width:0"></i>${marks}</div>
    <div class="alerts" data-timer="${b.id}:${id}">${alertsHtml(b, id)}</div>
    <div class="btn-row">
      <button data-act="timerAdj" data-t="${id}" data-d="-1">−1 წთ</button>
      <button data-act="timerPause" data-t="${id}">${ic(t.paused ? 'play' : 'pause')} ${t.paused ? 'გაგრძელება' : 'პაუზა'}</button>
      <button data-act="timerAdj" data-t="${id}" data-d="1">+1 წთ</button>
    </div>
    <button class="ghost small" data-act="timerReset" data-t="${id}" style="min-height:44px;color:var(--muted)">${ic('reset')} თავიდან დაწყება</button>
  </section>`;
}

function renderCalc(r, b, c) {
  if (!c.ready) return msgHtml('warn', 'შეიყვანე მოცულობა ქვაბში და Brix (ნაბიჯები 19–20).');
  return `<section class="panel">
    <div class="stat"><span class="cap">დაამატე წყალი</span><span class="big">${mlRound(c.addL)} მლ</span><span class="cap">საბოლოო მოცულობა ${fmt(c.vol, 2)} ლ</span></div>
    <div class="tiles">
      <div class="tile"><span class="k">OG</span><span class="v">${c.og.toFixed(3)}</span></div>
      <div class="tile"><span class="k">ABV ~</span><span class="v">${fmt(c.abv)}%</span></div>
      <div class="tile"><span class="k">საბოლოო Brix</span><span class="v">${fmt(c.finalBrix)}</span></div>
      <div class="tile ${c.bitterHigh ? 'warn' : ''}"><span class="k">სიმწარე, გ/ლ</span><span class="v">${fmt(c.bitter, 2)}${c.bitterHigh ? ' ↑' : ''}</span></div>
    </div>
    <div class="kv small muted"><span>ტკბილი ნიმუშის გარეშე</span><b>${fmt(c.wortL, 2)} ლ</b><span>Brix / სამიზნე</span><b>${fmt(c.brix)} / ${r.targetBrix}</b></div>
  </section>
  ${c.belowTarget ? msgHtml('warn', 'Brix სამიზნეზე დაბალია — წყალს ნუ დაამატებ.') : ''}
  ${c.capped ? msgHtml('info', `მოცულობა შეზღუდულია ${r.maxVolumeL} ლ-ით — Brix სამიზნეზე მაღალი დარჩება (${fmt(c.finalBrix)}).`) : ''}
  ${c.bitterHigh ? msgHtml('warn', `სიმწარე მაღალია (> ${BITTER_HIGH_G_PER_L} გ/ლ).`) : ''}
  ${c.lowEff ? msgHtml('bad', 'ეფექტურობა დაბალია, ალბათ დაფქვა. ალტერნატივა: ნაკლები Brix-ით მეტი მოცულობა.')
    + (c.alts.length ? `<div class="panel tablewrap"><table><tr><th>Brix</th><th>მოცულობა</th><th>წყალი</th><th>ABV</th></tr>
      ${c.alts.map(a => `<tr><td class="n">${a.tb}</td><td class="n">${fmt(a.L, 2)} ლ${a.over ? ' ⚠' : ''}</td><td class="n">${mlRound(a.add)} მლ</td><td class="n">~${fmt(a.abv)}%</td></tr>`).join('')}
      </table>${c.alts.some(a => a.over) ? `<p class="small muted">⚠ მეტია ${r.maxVolumeL} ლ-ზე</p>` : ''}</div>` : '') : ''}`;
}

/* ხარშვის დღის შეჯამება: ნაბიჯები, დრო, ციფრები */
function stepValues(b, st) {
  return (st.inputs || []).map(inp => { const v = val(b, inp.k); return v != null ? `${inp.label}: ${v} ${inp.unit}` : null; }).filter(Boolean).join('; ');
}
function renderSummary(b) {
  const r = recipeOf(b), c = calc(b, r);
  const rows = STEPS.filter(s => b.stepsDone[s.key] || stepValues(b, s));
  return `${c.ready ? `<div class="tiles">
      <div class="tile"><span class="k">OG</span><span class="v">${c.og.toFixed(3)}</span></div>
      <div class="tile"><span class="k">მოცულობა</span><span class="v">${fmt(val(b, 'finalVol') || c.vol, 2)} ლ</span></div>
      <div class="tile"><span class="k">ABV ~</span><span class="v">${fmt(c.abv)}%</span></div></div>` : ''}
    ${rows.length ? `<div class="tablewrap"><table><tr><th>ნაბიჯი</th><th>დრო</th><th>ციფრი</th></tr>
    ${rows.map(s => `<tr><td>${STEPS.indexOf(s) + 1}. ${s.title}</td><td class="n">${fmtTime(b.stepsDone[s.key])}</td><td>${esc(stepValues(b, s))}</td></tr>`).join('')}
    </table></div>` : '<p class="muted small">ჯერ ჩანაწერი არ არის.</p>'}`;
}

/* --- 8.5 დადუღების დღიური --- */
function ensureFerm(b, day) {
  let e = b.fermentationLog.find(x => x.day === day);
  if (!e) {
    e = { day, date: addDays(brewDay(b), day), temp: null, airlock: '', foam: '', note: '', fg: null };
    b.fermentationLog.push(e); b.fermentationLog.sort((a, z) => a.day - z.day);
  }
  return e;
}

  const days = [...new Set([...FERM_DAYS, ...b.fermentationLog.map(e => e.day)])].sort((a, z) => a - z);
  const today = todayStr();
  const lastAir = [...b.fermentationLog].reverse().find(e => e.airlock);
  const dayNow = daysBetween(brewDay(b), today);
  const hasData = e => e && (e.temp != null || e.airlock || e.foam || e.note || e.fg != null);
  return `${appbar('დადუღება', `#/batch/${b.id}`)}<main class="wrap enter">
    <section class="panel airlock-hero">
      ${airlockSvg(lastAir ? lastAir.airlock : '')}
      <div class="sec">
        <span class="eyebrow">${esc(b.name)}</span>
        <h2>${dayNow >= 0 ? `დღე ${dayNow}` : 'ჯერ არ დაწყებულა'}</h2>
        <p class="muted small">ხარშვის დღე: ${fmtDate(brewDay(b))}${lastAir ? ` · საკეტი: ${lastAir.airlock.toLowerCase()}` : ''}</p>
      </div>
    </section>
    <div class="days" role="list">${days.map(day => {
      const e = b.fermentationLog.find(x => x.day === day);
      return `<button type="button" class="${hasData(e) ? 'has' : ''} ${day === dayNow ? 'now' : ''}" data-act="scrollDay" data-day="${day}">${day}<small>${FG_DAYS[day] ? 'FG' : 'დღე'}</small></button>`;
    }).join('')}</div>
    <div id="ferm-live" class="sec">${fermLiveHtml(b)}</div>
    <label class="field"><span class="lbl">Brix-ის ინსტრუმენტი</span><select id="f-instr" data-bind="batch:instrument">
      <option value="hydro" ${b.instrument !== 'refract' ? 'selected' : ''}>არეომეტრი — SG = 1 + Brix × 0.004</option>
      <option value="refract" ${b.instrument === 'refract' ? 'selected' : ''}>რეფრაქტომეტრი — ალკოჰოლის კორექციით</option></select></label>
    ${days.map(day => {
      const e = b.fermentationLog.find(x => x.day === day) || { day, date: addDays(brewDay(b), day) };
      const fgLabel = FG_DAYS[day] || (e.fg != null || day > 9 ? 'FG' : null);
      const isToday = e.date === today;
      return `<section class="panel ${isToday ? 'today' : ''}" id="day-${day}" style="scroll-margin-top:80px">
        <div class="sec-head" style="margin:0"><h3>დღე ${day}${FG_DAYS[day] ? ` · ${FG_DAYS[day]}` : ''}</h3><span class="small ${isToday ? '' : 'muted'}" ${isToday ? 'style="color:var(--amber);font-weight:700"' : ''}>${isToday ? 'დღეს · ' : ''}${fmtDate(e.date)}</span></div>
        <label class="field"><span class="lbl">ტემპერატურა</span>${unitInput(`id="f-${day}-t" data-bind="ferm:${day}:temp" data-num="1"`, e.temp ?? '', '°C')}</label>
        <div class="field"><span class="lbl small muted" style="font-weight:600">საკეტი</span>
          <div class="chips">${AIRLOCK.map((a, k) => `<button type="button" class="${e.airlock === a ? 'on' : ''} ${['', 'slow', 'stop'][k]}" aria-pressed="${e.airlock === a}" data-act="setAirlock" data-day="${day}" data-v="${a}">${ic(['bubbles', 'drop', 'pause'][k])}${a}</button>`).join('')}</div></div>
        ${fgLabel ? `<label class="field"><span class="lbl">${fgLabel}</span>${unitInput(`id="f-${day}-fg" data-bind="ferm:${day}:fg" data-num="1"`, e.fg ?? '', 'Bx')}</label>` : ''}
        <div class="grid2">
          <label class="field"><span class="lbl">ქაფი (სადამდე)</span><input id="f-${day}-f" data-bind="ferm:${day}:foam" value="${esc(e.foam)}"></label>
          <label class="field"><span class="lbl">შენიშვნა</span><input id="f-${day}-n" data-bind="ferm:${day}:note" value="${esc(e.note)}"></label>
        </div>
      </section>`;
    }).join('')}
    <button data-act="addFermDay">${ic('plus')} დამატებითი დღე (FG ხელახლა)</button>
    <section class="panel"><h3>შემდეგ</h3>
      <ul style="margin:0;padding-left:20px"><li>FG #1 = FG #2 → დადუღება დასრულდა.</li><li>Cold crash: 2 დღე მაცივარში.</li><li>ჩამოსხმა.</li></ul>
      <a class="btn" href="#/bottle/${b.id}">${ic('bottle')} ჩამოსხმაზე გადასვლა</a></section>

}
function fermLiveHtml(b) {
  const st = fermStats(b);
  return `<div class="tiles">
      <div class="tile"><span class="k">OG</span><span class="v">${st.og ? st.og.toFixed(3) : '—'}</span></div>
      <div class="tile"><span class="k">FG</span><span class="v">${st.fgSG ? st.fgSG.toFixed(3) : '—'}</span></div>
      <div class="tile"><span class="k">ABV</span><span class="v">${st.abv != null ? fmt(st.abv) + '%' : '—'}</span></div></div>
    ${st.finished ? msgHtml('ok', 'დადუღება დასრულდა! FG სტაბილურია. Cold crash: 2 დღე მაცივარში, მერე ჩამოსხმა.')
      : st.fgCount >= 2 ? msgHtml('warn', 'FG ჯერ იცვლება — დაელოდე 2 დღე და გაზომე ხელახლა.') : ''}`;
}

function bottleLiveHtml(b) {
  const v = b.bottling.volume;

    : msgHtml('info', 'შეიყვანე მოცულობა — შაქარს დავითვლი.');

/* --- 8.7 ექსპორტი (Markdown) --- */
function exportMd(b) {
  const r = recipeOf(b), c = calc(b, r), fs = fermStats(b), bt = b.bottling;
  const L = [];
  L.push(`# ${b.name}`, '', `- თარიღი: ${fmtDate(b.date)}`, `- სტატუსი: ${STATUS[b.status]}`, '');
  L.push(`## რეცეპტი: ${r.name}${r.style ? ` (${r.style})` : ''}`, '');
  L.push('| მარცვალი | გ | ჩაყრა (წთ) |', '|---|---:|---:|', ...r.grains.map(g => `| ${g.name} | ${g.grams} | ${grainMin(g)} |`), '');
  L.push('| სვია | გ | ბოლომდე (წთ) |', '|---|---:|---:|', ...r.hops.map(h => `| ${h.name} | ${h.grams} | ${h.minute} |`), '');
  L.push(`- საფუარი: ${r.yeast.name}, ${r.yeast.grams} გ (${r.yeast.tempMin}–${r.yeast.tempMax}°C)`);
  L.push(`- გაშაქრება: ${r.mashTemp}°C, ${r.mashMin} წთ, ${r.mashWaterL} ლ წყალი; ჩამორეცხვა ${r.spargeWaterL} ლ`);
  L.push(`- ხარშვა: ${r.boilMin} წთ; სამიზნე Brix ${r.targetBrix}; მაქს. ${r.maxVolumeL} ლ`);
  L.push(`- მოსალოდნელი ფერი: ${colorName(beerSrm(r))} (≈ EBC ${Math.round(beerSrm(r) * 1.97)})`, '');
  L.push('## ხარშვის დღე', '', '| # | ნაბიჯი | დრო | ციფრი |', '|---:|---|---|---|');
  STEPS.forEach((s, i) => L.push(`| ${i + 1} | ${s.title} | ${b.stepsDone[s.key] ? fmtTime(b.stepsDone[s.key]) : '—'} | ${stepValues(b, s) || ''} |`));
  L.push('');
  if (c.ready) {
    L.push(`- დამატებული წყალი: ${Math.round(c.addL * 1000)} მლ`, `- საბოლოო მოცულობა: ${fmt(val(b, 'finalVol') || c.vol, 2)} ლ`,
      `- OG: ${c.og.toFixed(3)} (${fmt(c.finalBrix)} Bx)`, `- სავარაუდო ABV: ~${fmt(c.abv)}%`, `- სიმწარე: ${fmt(c.bitter, 2)} გ/ლ`, '');
  }
  L.push('## დადუღება', '', '| დღე | თარიღი | °C | საკეტი | ქაფი | FG Bx | შენიშვნა |', '|---:|---|---:|---|---|---:|---|');
  b.fermentationLog.forEach(e => L.push(`| ${e.day} | ${fmtDate(e.date)} | ${e.temp ?? ''} | ${e.airlock || ''} | ${e.foam || ''} | ${e.fg ?? ''} | ${e.note || ''} |`));
  if (fs.abv != null) L.push('', `- FG: ${fs.fgSG.toFixed(3)} · ABV: ${fmt(fs.abv)}%${fs.finished ? ' · დადუღება დასრულდა' : ''}`);
  L.push('', '## ჩამოსხმა', '');
  L.push(`- თარიღი: ${fmtDate(bt.date)}`, `- მოცულობა: ${bt.volume ?? '—'} ლ`, `- შაქარი: ${bt.volume ? fmt(bt.volume * SUGAR_G_PER_L) : '—'} გ`,
    `- ბოთლები: ${bt.bottles ?? '—'}`, `- FG: ${bt.fg ?? '—'} Bx`, `- გემო: ${bt.tasting || '—'}`);
  if (b.notes) L.push('', '## შენიშვნები', '', b.notes);
  return L.join('\n');
}
function viewExport(b) {
  return `${appbar('ექსპორტი', `#/batch/${b.id}`)}<main class="wrap">
    <p class="muted">მთელი პარტია Markdown ტექსტად — ჩასვი შენიშვნებში, ჩატში ან GitHub-ზე.</p>
    <button class="primary" data-act="copyMd">${ic('copy')} კოპირება</button>

  </main>${tabbar('home')}`;
}

function getPath(o, path) { return path.split('.').reduce((x, k) => x == null ? x : x[k], o) ?? ''; }
function setPath(o, path, v) {
  const ks = path.split('.'); const last = ks.pop();
  ks.reduce((x, k) => x[k], o)[last] = v;
}
/* მარცვლის ჯამის ცვლილებისას: წყალი 3 ლ/კგ, სვია და ჩამორეცხვა პროპორციულად, Brix უცვლელი */
function rescaleRecipe(r, oldTotal, newTotal) {
  if (!r.autoScale || !oldTotal || !newTotal || oldTotal === newTotal) return false;
  const k = newTotal / oldTotal;
  r.mashWaterL = round1(MASH_WATER_L_PER_KG * newTotal / 1000);
  r.spargeWaterL = round1(r.spargeWaterL * k);
  r.hops.forEach(h => { h.grams = round1(h.grams * k); });
  return true;
}
function syncRecipeInputs(r) {
  document.querySelectorAll('[data-bind^="rec:"]').forEach(el => {
    if (el === document.activeElement || el.type === 'checkbox') return;
    el.value = getPath(r, el.dataset.bind.slice(4));
  });
  const t = $('#grainTotal'); if (t && t !== document.activeElement) t.value = grainTotal(r);
  const s = $('#grainSum'); if (s) s.textContent = `${grainTotal(r)} გ`;
  const h = $('#hopSum'); if (h) h.textContent = `${fmt(r.hops.reduce((x, y) => x + (+y.grams || 0), 0))} გ`;
  const iss = $('#issues'); if (iss) iss.innerHTML = recipeIssues(r).map(t => msgHtml('warn', t)).join('');
  const hero = $('#beerHero'); if (hero) hero.innerHTML = beerHeroHtml(r);
}
/* რეცეპტის „პორტრეტი": ჭიქა მოსალოდნელ ფერში */
function beerHeroHtml(r) {
  const srm = beerSrm(r);
  return `${glassSvg(srmHex(srm), 0.85, 64)}<div class="sec" style="gap:4px">
    <span class="eyebrow">მოსალოდნელი ფერი</span><h2>${colorName(srm)}</h2>
    <span class="small muted num">≈ EBC ${Math.round(srm * 1.97)} · SRM ${fmt(srm)} · ${fmt(grainTotal(r) / 1000, 2)} კგ მარცვალი</span></div>`;
}
let savedTimer = null;
function flashSaved() {
  const el = $('#saved'); if (!el) return;
  el.textContent = 'შენახულია ✓'; el.classList.add('flash');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { el.classList.remove('flash'); el.textContent = 'ავტომატურად ინახება'; }, 1500);
}
