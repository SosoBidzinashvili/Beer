<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ხარშვის ასისტენტი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  /* =====================================================================
     დიზაინი H — „სტიკერ-სახარში": ელექტრო-ყვითელი ფონი, მწვანე მენიუ, თეთრი/ფერადი ფილები,
     შავი კონტურები და მყარი ჩრდილები, ბუშტუკოვანი ციფრები ფერადი ჩრდილით, მასკოტი-ჭიქა.
     ფერი: ყვითელი #fff200 · მწვანე #16b60d · ვარდისფერი #ff2fb3 · ცისფერი #22c7ff · იისფერი #b06cff · შავი #111
     ტიპი:  Noto Sans Georgian 900 სათაურებს და ციფრებს; 500/700 ტექსტს; Space Mono პატარა ტექნიკურ სტრიქონებს.
     ===================================================================== */
  :root {
    color-scheme: light;
    --yellow: #fff200; --green: #16b60d; --green-d: #0a5c05; --pink: #ff2fb3; --blue: #22c7ff; --purple: #b06cff; --coral: #ff4d1f; --amber: #ffb400; --cyan: #7df9ff;
    --ink: #111111; --ink-2: #3a3a3a; --ink-3: #6b6b6b; --white: #ffffff; --cream: #fffbe6;
    --bg: var(--yellow); --fg: var(--ink); --muted: var(--ink-3); --faint: #8a8a8a;
    --paper: var(--white); --paper-2: #f3f3f3; --line: rgba(17,17,17,.14); --line-2: rgba(17,17,17,.3);
    --brass: var(--ink); --amber-soft: rgba(17,17,17,.08); --on-amber: var(--white);
    --hop: var(--green); --copper: var(--coral);
    --ok: #0e8a07; --ok-soft: #d9f7d3; --warn: #b85b00; --warn-soft: #ffe7c2; --bad: #c0190f; --bad-soft: #ffd8d3; --info: #0b5f8a; --info-soft: #d9f3ff; --violet: var(--purple);
    --beer: #f8a600;
    --font-ui: "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-display: var(--font-ui); --font-fig: var(--font-ui); --font-num: var(--font-ui); --font-mono: "Space Mono", ui-monospace, monospace;
    --t-xs: .8rem; --t-sm: .93rem; --t-md: 1.05rem; --t-lg: 1.3rem; --t-xl: 2.1rem;
    --r: 28px; --r-sm: 16px; --tap: 56px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --side: 0px;            /* დესკტოპზე გვერდითი პანელის სიგანე */
    --shadow: 5px 5px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font-ui); font-size: var(--t-md); line-height: 1.5; font-weight: 500; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  #app { position: relative; z-index: 1; }
  #beer { display: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  main.wrap { padding-block: 12px 28px; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { margin: 0; line-height: 1.08; letter-spacing: -.02em; font-weight: 900; text-wrap: balance; }
  h1 { font-size: var(--t-xl); } h2 { font-size: var(--t-lg); display: flex; align-items: center; gap: 10px; } h3 { font-size: var(--t-md); }
  p { margin: 0; } a { color: var(--ink); }
  .eyebrow { font-size: var(--t-sm); font-weight: 800; color: var(--ink); }
  .muted { color: var(--ink-3); } .small { font-size: var(--t-sm); }
  .num, .fig { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); font-size: .9em; }
  .ic { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sec { display: flex; flex-direction: column; gap: 10px; } .sec:empty { display: none; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; }
  .rule, .rule-ink { height: 3px; background: var(--ink); border: 0; margin: 4px 0; border-radius: 2px; }
  /* ბუშტუკოვანი ციფრები ფერადი ჩრდილით */
  .bub { font-weight: 900; letter-spacing: -.02em; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; color: var(--white); text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--blue), 9px 9px 0 var(--green); }

  /* ---------- ფილები ---------- */
  .panel, .paper, .batch, .list, details, .tile, .pick, .item, .taplist { background: var(--white); color: var(--ink); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); }
  .panel { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .panel.hl { background: var(--cream); }
  .paper { position: relative; } .paper::before, .paper::after { display: none; }
  .paper > * { position: relative; z-index: 1; }
  .label-cut { border-radius: var(--r); }
  .tile { border-radius: var(--r-sm); border-width: 2px; box-shadow: none; padding: 10px 12px; display: flex; flex-direction: column; gap: 0; min-width: 0; background: var(--cream); }
  .tile .k { font-size: var(--t-xs); color: var(--ink-3); font-weight: 700; } .tile .v { font-size: 1.5rem; font-weight: 900; line-height: 1.2; }
  .tile.warn .v { color: var(--coral); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .spec { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--t-sm); color: var(--ink-3); } .spec b { color: var(--ink); font-weight: 900; margin-left: 4px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: baseline; } .kv > b { text-align: right; font-weight: 900; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; }
  .stat .big { font-size: 3.6rem; font-weight: 900; line-height: 1; } .stat .cap { font-size: var(--t-sm); color: var(--ink-3); text-align: center; font-weight: 700; }

  /* ---------- ღილაკები ---------- */
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tap); padding: 10px 20px; border-radius: 999px;
    border: 3px solid var(--ink); background: var(--white); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; width: 100%; text-decoration: none; text-align: center;
    touch-action: manipulation; box-shadow: var(--shadow); transition: transform .08s, box-shadow .08s; }
  button:active, .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .primary { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .ghost { background: transparent; box-shadow: none; }
  .danger { background: var(--white); color: var(--coral); border-color: var(--coral); box-shadow: 5px 5px 0 var(--coral); }
  .icon-btn { width: var(--tap); min-width: var(--tap); padding: 0; flex: none; }
  button:disabled { opacity: .35; box-shadow: none; } .gated { opacity: .5; }
  .btn-row { display: flex; gap: 12px; } .btn-row > * { flex: 1; min-width: 0; }
  .paper button, .paper .btn { box-shadow: 4px 4px 0 var(--ink); }
  .paper .ghost { box-shadow: none; }

  /* ---------- ველები ---------- */
  label.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  label.field > .lbl, .reading .lbl { font-size: var(--t-sm); color: var(--ink-2); font-weight: 800; }
  input, select, textarea { font: inherit; font-weight: 600; color: var(--ink); background: var(--white); border: 3px solid var(--ink); border-radius: var(--r-sm); padding: 12px 16px; width: 100%; min-height: var(--tap); min-width: 0; }
  textarea { min-height: 104px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 4px var(--blue); }
  input[type=date] { cursor: pointer; -webkit-appearance: none; appearance: none; }
  input[type=date]::-webkit-calendar-picker-indicator { opacity: 1; cursor: pointer; width: 26px; height: 26px; padding: 0; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; min-height: 1.4em; }
  .unit-in { position: relative; display: block; min-width: 0; }
  .unit-in input { padding-right: 2.6em; font-variant-numeric: tabular-nums; font-weight: 800; }
  .unit-in > span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; font-size: var(--t-sm); font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .reading { display: flex; flex-direction: column; gap: 8px; } .reading .lbl { display: flex; justify-content: space-between; gap: 8px; }
  .stepper { display: grid; grid-template-columns: 66px 1fr 66px; gap: 10px; align-items: stretch; }
  .stepper button { min-height: 76px; padding: 0; border-radius: 22px; font-size: 1.6rem; }
  .stepper .unit-in input { min-height: 76px; font-size: 2.3rem; font-weight: 900; text-align: center; padding: 6px 1.5em 6px .7em; border-radius: 22px; }
  .stepper .unit-in > span { right: 12px; }
  .checks { display: flex; flex-direction: column; }
  .check { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 2px; border-bottom: 2px solid var(--line); cursor: pointer; font-weight: 600; }
  .check:last-child { border-bottom: 0; }
  .check input { appearance: none; -webkit-appearance: none; width: 30px; height: 30px; min-height: 0; padding: 0; flex: none; border: 3px solid var(--ink); border-radius: 50%; background: var(--white); display: grid; place-items: center; }
  .check input:checked { background: var(--green); animation: pop .25s ease-out; }
  .check input:checked::after { content: ""; width: 7px; height: 12px; border: solid var(--ink); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
  .check.done > span { color: var(--ink-3); text-decoration: line-through; }
  @keyframes pop { 50% { transform: scale(1.2); } }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; width: 58px; height: 34px; min-height: 0; padding: 0; border-radius: 99px; background: var(--white); border: 3px solid var(--ink); position: relative; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .switch input:checked { background: var(--green); } .switch input:checked::after { transform: translateX(24px); }

  /* ---------- სტიკერები, ტეგები, შეტყობინებები ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-size: var(--t-xs); font-weight: 900; white-space: nowrap; background: var(--white); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(var(--tilt, -2deg)); }
  .pill.planned { --tilt: 2deg; background: var(--blue); } .pill.brewing { --tilt: -3deg; background: var(--amber); } .pill.fermenting { --tilt: 2.5deg; background: var(--green); color: var(--white); }
  .pill.bottled { --tilt: -2deg; background: var(--purple); } .pill.done { --tilt: 1.5deg; background: var(--ink); color: var(--yellow); }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--ink); color: var(--yellow); font-size: var(--t-xs); font-weight: 800; white-space: nowrap; }
  .debug { display: inline-block; background: var(--coral); color: var(--white); font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 900; vertical-align: middle; letter-spacing: .1em; border: 2px solid var(--ink); transform: rotate(3deg); }
  .msg { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); font-weight: 700; border: 2px solid var(--ink); }
  .msg .ic { margin-top: 2px; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); } .msg.warn { background: var(--warn-soft); color: var(--warn); } .msg.bad { background: var(--bad-soft); color: var(--bad); } .msg.info { background: var(--info-soft); color: var(--info); }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--green); border: 2px solid var(--ink); }
  .dot.warn { background: var(--amber); } .dot.bad { background: var(--coral); }
  .assess.ok { background: var(--ok-soft); } .assess.warn { background: var(--warn-soft); } .assess.bad { background: var(--bad-soft); }

  /* ---------- სიები და ბარათები ---------- */
  .list { display: flex; flex-direction: column; overflow: hidden; }
  .list-row, .paper button.list-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 70px; color: var(--ink); text-decoration: none; background: none; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; text-align: left; font-weight: 600; justify-content: flex-start; box-shadow: none; width: 100%; }
  .list-row:last-child, .paper button.list-row:last-child { border-bottom: 0; }
  .list-row .ic.lead { color: var(--ink); width: 1.6em; height: 1.6em; } .list-row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .list-row .title { font-weight: 900; } .list-row .sub { font-size: var(--t-sm); color: var(--ink-3); } .list-row .chev { color: var(--ink-3); }
  .batch { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; color: var(--ink); text-decoration: none; }
  .batch .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .batch .top .ic { color: var(--ink-3); }
  .batch .name { font-weight: 900; font-size: 1.45rem; line-height: 1.1; min-width: 0; overflow-wrap: anywhere; letter-spacing: -.02em; }
  .meter { height: 10px; background: var(--white); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; } .meter > div { height: 100%; background: var(--green); }
  .card-glass { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; } .card-glass .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .art { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 3px solid var(--ink); }
  .artbox { width: 64px; height: 64px; flex: none; } .artbox.lg { width: 96px; height: 96px; } .tap .artbox { width: 56px; height: 56px; }
  .beer-strip { height: 12px; border-radius: 6px; background: var(--c); border: 2px solid var(--ink); }
  .taplist { display: flex; flex-direction: column; overflow: hidden; padding: 4px 0; }
  .taplist .tl-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px 8px; }
  .tap { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 12px 20px; color: var(--ink); text-decoration: none; border-top: 2px solid var(--line); }
  .tap .nm { font-weight: 900; font-size: 1.3rem; line-height: 1.1; overflow-wrap: anywhere; letter-spacing: -.02em; } .tap .meta { font-size: var(--t-sm); color: var(--ink-3); } .tap .now { font-size: var(--t-sm); font-weight: 600; }
  .tap .side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; } .tap .abv { font-size: 1.4rem; font-weight: 900; line-height: 1; } .tap .abv small { font-size: var(--t-xs); color: var(--ink-3); margin-left: 2px; }
  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px; color: var(--ink); text-align: center; font-weight: 800; min-height: 0; box-shadow: none; border-width: 3px; }
  .pick span { font-size: 1.1rem; font-weight: 900; } .pick small { color: var(--ink-3); font-weight: 600; } .pick.on { background: var(--blue); box-shadow: var(--shadow); }
  .paper .pick { background: var(--white); } .paper .pick.on { background: var(--blue); }

  /* ---------- ზოლები ---------- */
  .appbar, .brewbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--yellow); border-bottom: 3px solid var(--ink); }
  .appbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 68px; }
  .appbar .ttl { flex: 1; min-width: 0; font-weight: 900; font-size: 1.4rem; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .icon-btn, .brewbar .icon-btn { min-height: 48px; width: 48px; min-width: 48px; box-shadow: 3px 3px 0 var(--ink); }
  .saved { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; font-weight: 700; } .saved.flash { color: var(--ok); }
  /* ტაბ-ზოლი: ტელეფონზე ქვევით, დესკტოპზე — მარცხენა მწვანე მენიუ ყვითელ რელსზე */
  .tabbar { position: fixed; left: var(--gutter-l); right: var(--gutter-r); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--green); border: 3px solid var(--ink); border-radius: 24px; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
  .tabbar .rail { display: none; }
  .tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: 16px; color: var(--ink); text-decoration: none; font-size: 11px; font-weight: 800; }
  .tabbar a.on { background: var(--ink); color: var(--yellow); }
  .actionbar { position: fixed; left: var(--gutter-l); right: var(--gutter-r); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
  .actionbar .wrap { display: grid; grid-template-columns: 54px 1fr 2fr; gap: 8px; padding: 8px; }
  .actionbar button { min-height: 52px; white-space: nowrap; padding: 8px 10px; box-shadow: none; }
  .actionbar .icon-btn { width: 54px; min-width: 54px; }

  /* ---------- ხარშვის რეჟიმი ---------- */
  .brewbar .wrap { padding-block: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .brewbar .row1 { display: flex; align-items: center; gap: 10px; }
  .brewbar .icon-btn.on { background: var(--ink); color: var(--yellow); }
  .segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; cursor: pointer; }
  .segs > div { height: 10px; border-radius: 5px; background: var(--white); border: 2px solid var(--ink); overflow: hidden; } .segs > div > i { display: block; height: 100%; }
  .where-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 46px; padding: 2px 4px; background: none; border: 0; box-shadow: none; text-align: left; line-height: 1.25; font-weight: 400; border-radius: 10px; }
  .where-btn .eyebrow { display: flex; align-items: center; gap: 6px; } .where-btn b { font-weight: 900; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--white); border: 3px solid var(--ink); color: var(--ink); font-weight: 900; font-size: var(--t-sm); white-space: nowrap; min-height: 40px; }
  .step-head { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .stage-row { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin-top: 6px; padding: 18px 20px; border-radius: var(--r); background: var(--stage, var(--white)); border: 3px solid var(--ink); box-shadow: var(--shadow); }
  .stage-row .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .stage-row h1 { font-size: 2.3rem; }
  .seal { width: 84px; height: 84px; flex: none; display: block; }
  .seal .ring { fill: none; stroke: var(--ink); } .seal text { fill: var(--ink); }
  .seal .lt { font-weight: 900; } .seal .arc { font-weight: 800; letter-spacing: .14em; }
  .intro { color: var(--ink-2); font-weight: 600; font-size: var(--t-sm); }
  .instr { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 1.25rem; line-height: 1.4; counter-reset: ln; font-weight: 600; }

<script>
'use strict';

/* =====================================================================
   1. კონფიგურაცია — აქ ადვილად შეცვლი ციფრებს და ტექსტებს
   ===================================================================== */
const STORAGE_KEY = 'brewAssistant.v1';
const POT_SAFE_L = 4.0;           // 5 ლ ქვაბში მაქსიმალური უსაფრთხო მოცულობა ხარშვისთვის

const DEBUG_TIMER_MS = 10000;     // debug რეჟიმში ყოველი ტაიმერი 10 წამია
const SUGAR_G_PER_L = 5.5;        // ჩამოსხმის შაქარი, გ/ლ
const BITTER_HIGH_G_PER_L = 2.75; // სიმწარის ზღვარი (სვია გ/ლ)
const MASH_WATER_L_PER_KG = 3;    // გაშაქრების წყალი, ლ/კგ მარცვალზე
const COOL_MAX_T = 32;            // გაცივების ზღვარი, °C
const FERM_DAYS = [1, 2, 3, 5, 7, 9];
const FG_DAYS = { 7: 'FG #1', 9: 'FG #2' };
const AIRLOCK = ['აქტიური', 'ნელი', 'გაჩერდა'];

const STATUS = {
  planned: 'დაგეგმილი', brewing: 'იხარშება', fermenting: 'დუღს',
  bottled: 'ჩამოსხმული', done: 'დასრულებული'
};

/* ჩაშენებული რეცეპტები. სტაუტის ციფრები placeholder-ია — შეცვალე „რეცეპტებში".
   grains[].minute = გაშაქრების რომელ წუთზე ჩაიყაროს (0 = თავიდან).
   hops[].minute   = რამდენი წუთი რჩება ხარშვის ბოლომდე (60 = დასაწყისში). */
const DEFAULT_RECIPES = [
  {
    id: 'pale-kveik', name: 'ღია ელი (M12 Kveik)', style: 'Pale Ale / Kveik',
    grains: [{ name: 'Pilsner', grams: 900, minute: 0 }, { name: 'CARAHELL', grams: 220, minute: 0 }],
    hops: [{ name: 'Perle', grams: 6, minute: 60 }, { name: 'Perle', grams: 5, minute: 5 }],
    yeast: { name: 'M12 Kveik', grams: 3, tempMin: 20, tempMax: 30 },
    mashTemp: 70, mashMin: 60, boilMin: 60,

    targetBrix: 14, maxVolumeL: 4.0, autoScale: true
  },
  {

    grains: [{ name: 'Pilsner', grams: 1000, minute: 0 }, { name: 'Black', grams: 100, minute: 45 }],
    hops: [{ name: 'Perle', grams: 6, minute: 60 }, { name: 'Perle', grams: 5, minute: 5 }],
    yeast: { name: 'M44', grams: 3, tempMin: 18, tempMax: 24 },
    mashTemp: 68, mashMin: 60, boilMin: 60,
    mashWaterL: 3.3, spargeWaterL: 1.5,
    targetBrix: 14, maxVolumeL: 4.0, autoScale: true
  }
];

const INVENTORY = [
  'ქვაბი (5 ლ)', 'BIAB ტომარა', 'ნიჩაბი', 'ციფრული თერმომეტრი',
  'მეორე ქვაბი ჩამორეცხვისთვის', 'ჯამი ტომრისთვის',
  'ფერმენტერი + თავსახური + grommet + საკეტი', 'ძაბრი + საცერი',
  'ცილინდრი (250 მლ) + არეომეტრი', 'ჭიქა ნიმუშისთვის', 'სასწორი', 'საზომი დოქი',
  'სპირტი 70% სპრეი', 'ზეჟანგი 3%', 'მაკრატელი', 'ყინული', 'ლანგარი ფერმენტერისთვის'
];

const SANITIZE = [
  'ფერმენტერი: 0.5 ლ ზეჟანგი, შეანჯღრიე, 5–10 წთ, გადაღვარე',
  'სპირტით: თავსახური', 'სპირტით: grommet', 'სპირტით: საკეტი',
  'სპირტით: ძაბრი', 'სპირტით: საცერი', 'სპირტით: ცილინდრი', 'სპირტით: არეომეტრი',
  'სპირტით: ჭიქა', 'სპირტით: თერმომეტრის წვერი', 'სპირტით: მაკრატელი',
  'სპირტით: საფუარის პაკეტი გარედან', 'ნიჟარაში ყინულიანი წყალი მოამზადე'
];

const BOTTLING_CHECKS = [
  'ფერმენტერი 2 დღე მაცივარში (cold crash)',
  'შაქარი ცხელ წყალში (50 მლ) გახსენი',
  'სიროფი საერთო ჭურჭელში ჩაასხი',
  'სიფონი წყლით გავარჯიშე',
  'ფერმენტერი 40–50 სმ მაღლა დადგი',
  'ბოთლები და თავსახურები სპირტით',
  'ჩამოასხი (ბოთლში 2–3 სმ ჰაერი დატოვე)',
  'ბოთლები ოთახში 14 დღე',
  'მერე 2–3 დღე მაცივარში'
];

/* ეტაპები: თითოს თავისი ფერი, ხატულა და მოკლე შესავალი */
const STAGES = [
  { letter: 'ა', name: 'მომზადება', icon: 'scale', color: '#b06cff', intro: 'ყველაფერი ხელთ გქონდეს — და დავიწყოთ.' },
  { letter: 'ბ', name: 'გაშაქრება', icon: 'pot', color: '#ffb400', intro: 'სახამებელი შაქრად იქცევა.' },
  { letter: 'გ', name: 'ჩამორეცხვა', icon: 'drop', color: '#22c7ff', intro: 'ბოლო ტკბილ წვეთამდე.' },
  { letter: 'დ', name: 'ხარშვა', icon: 'flame', color: '#ff4d1f', intro: 'სვიის დრო!' },
  { letter: 'ე', name: 'გაცივება', icon: 'snow', color: '#7df9ff', intro: 'სწრაფად და სუფთად.' },
  { letter: 'ვ', name: 'გაზომვა და განზავება', icon: 'hydro', color: '#ff2fb3', intro: 'ციფრები, რომლებიც ლუდის ხასიათს წყვეტს.' },
  { letter: 'ზ', name: 'საფუარი', icon: 'yeast', color: '#16b60d', intro: 'საფუარი სამუშაოდ ემზადება.' },
  { letter: 'თ', name: 'დასრულება', icon: 'glass', color: '#ffffff', intro: 'თითქმის ლუდია!' }
];

/* მარცვალი: თავიდან ჩასაყრელი და გვიანი დამატებები (მაგ. Black 45-ე წუთზე) */
const grainMin = g => Math.max(0, +g.minute || 0);
const startGrains = r => r.grains.filter(g => grainMin(g) === 0);
const lateGrains = r => r.grains.filter(g => grainMin(g) > 0 && grainMin(g) < r.mashMin).sort((a, b) => grainMin(a) - grainMin(b));
/* სიგნალის დროს მომხმარებელი სავარაუდოდ რომელ ნაბიჯზეა */
const mashStepAt = (r, minute) => minute < r.mashMin / 2 ? 's9' : (r.mashMin - minute > 10 ? 's10' : 's11');

/* ტაიმერები. alerts[].at = რამდენი წუთი რჩება, როცა სიგნალი ირთვება. */
const TIMERS = {
  mash: {
    label: 'გაშაქრება',
    minutes: r => r.mashMin,
    alerts: r => [
      ...lateGrains(r).map((g, k) => ({ at: r.mashMin - grainMin(g), msg: `ჩაყარე ${g.grams} გ ${g.name} და კარგად მოურიე`, step: mashStepAt(r, grainMin(g)), check: ['lateGrains', k] })),
      { at: r.mashMin / 2, msg: 'შუა გაშაქრება: მოურიე და გაზომე ტემპერატურა', step: 's10' },
      ...(r.mashMin > 10 ? [{ at: 10, msg: `ჩამორეცხვის წყალი ${r.spargeWaterL} ლ გააცხელე 77°C-მდე`, step: 's11' }] : []),
      { at: 0, msg: 'გაშაქრება დასრულდა! ტომარა ასწიე', step: 's12' }
    ].sort((a, b) => b.at - a.at)
  },
  boil: {
    label: 'ხარშვა',
    minutes: r => r.boilMin,
    alerts: r => [
      ...r.hops.slice().sort((a, b) => b.minute - a.minute).map((h, k) => ({ h, k })).filter(({ h }) => h.minute < r.boilMin && h.minute >= 0)
        .map(({ h, k }) => ({ at: h.minute, msg: `ჩაყარე ${h.grams} გ ${h.name}`, step: 's15', check: ['s15', k] })),
      ...(r.boilMin > 15 ? [{ at: 15, msg: 'ბოლომდე 15 წთ: დეზინფექციის დროა', step: 's16' }] : []),
      { at: 0, msg: 'ხარშვა დასრულდა: ცეცხლი გამორთე, თავსახური დაახურე', step: 's17' }
    ].sort((a, b) => b.at - a.at)
  },
  cool: {
    label: 'გაცივება',
    minutes: () => 20,
    alerts: () => [{ at: 0, msg: '20 წთ გავიდა: გაზომე ტემპერატურა', step: 's18' }]
  }
};

/* გვიანი მარცვლის ჩეკლისტი (ნაბიჯები 9–11 იზიარებენ ერთ ჩეკლისტს) */
const lateGrainChecklist = r => lateGrains(r).map(g => `${g.grams} გ ${g.name} — ${grainMin(g)}-ე წუთზე`);

/* ხარშვის დღის ნაბიჯები. ციფრები მოდის რეცეპტიდან (r), პარტიიდან (b) და კალკულატორიდან (c).
   ველები: key, stage, title, lines() → [ტექსტი | {text, later}], inputs[{k,label,unit,step,start()}],
   checklist(), checklistKey, checklistTitle, timer, autoTimer, gauge(), feedback() → [{cls,text}],
   gate() → შეტყობინება ან null, trouble[], doneLabel, custom() → HTML */
const STEPS = [
  /* ---- ა. მომზადება ---- */
  { key: 's1', stage: 0, title: 'ინვენტარის ჩეკლისტი',
    lines: () => ['მოაგროვე ყველაფერი ერთ ადგილას.', 'მონიშნე, რაც მზადაა.'],
    checklist: () => INVENTORY,
    trouble: ['ნიჩაბი არ გაქვს? გრძელი ხის კოვზი.', 'ჯამის ნაცვლად — მეორე ქვაბი ან დიდი თასი.', 'არეომეტრის გარეშე ნუ დაიწყებ: Brix განზავებისთვის აუცილებელია.'] },
  { key: 's2', stage: 0, title: 'ბაკურიანი მაცივარში',
    lines: () => ['1.5–2 ლ ბაკურიანი ჩადე მაცივარში.', 'ეს წყალი განზავებისთვისაა: ცივი და სუფთა.'],
    trouble: ['ბაკურიანი არ გაქვს? ადუღებული და გაცივებული წყალი, დახურულ ჭურჭელში.'] },
  { key: 's3', stage: 0, title: 'მარცვალი აწონე და დაფქვი',
    lines: r => ['აწონე თითო მარცვალი ცალკე.', 'დაფქვი დღესვე, ხარშვის წინ.',
      ...(lateGrains(r).length ? ['გვიანი მარცვალი ცალკე ჯამში შეინახე — ის მოგვიანებით ჩაიყრება.'] : [])],
    checklist: r => r.grains.map(g => `${g.name} — ${g.grams} გ${grainMin(g) > 0 ? ` (ცალკე, ${grainMin(g)}-ე წუთზე)` : ''}`),
    trouble: ['უხეში დაფქვა = დაბალი Brix. BIAB-ში წვრილი დაფქვა ნორმალურია.', 'ფქვილად ნუ აქცევ — ტომარა გაიჭედება.'] },
  { key: 's4', stage: 0, title: 'სვია აწონე',
    lines: () => ['აწონე თითო დამატება ცალ-ცალკე.', 'ქაღალდზე დააწერე გრამი და წუთი.', 'საყინულეში დააბრუნე.'],
    checklist: r => r.hops.map(h => `${h.name} — ${h.grams} გ (@${h.minute} წთ)`),
    trouble: ['სასწორი 1 გ-ს ვერ აჩვენებს? აწონე ერთად და გაყავი თვალით.'] },
  { key: 's5', stage: 0, title: 'ფერმენტერზე ხაზები',
    lines: () => ['მარკერით გაავლე ხაზები: 2.0 / 2.5 / 3.0 / 3.5 / 4.0 ლ.', 'გაზომე საზომი დოქით, წყლით.', 'მერე წყალი გადაღვარე.'],
    trouble: ['მარკერი იშლება? ფერადი ლენტი გარედან.'] },
  { key: 's6', stage: 0, title: 'საკეტი შეავსე',
    lines: () => ['საკეტი წყლით შეავსე ხაზამდე.'],
    trouble: ['სჯობს ადუღებული წყალი ან არაყი.'] },

  /* ---- ბ. გაშაქრება ---- */
  { key: 's7', stage: 1, title: 'წყალი გააცხელე',
    lines: r => [`ქვაბში ჩაასხი ${r.mashWaterL} ლ წყალი.`, 'თერმომეტრი კიდეზე, ცეცხლი ჩართე.',
      `სამიზნე: ${r.mashTemp + 8}°C.`, 'ტომარა ჯერ არ ჩადო.'],
    trouble: ['გადააჭარბე? თავსახური ახადე, ურიე და დაელოდე.', 'მარცვალი ცივია — ამიტომ ვაცხელებთ 8°C-ით მეტზე.'] },
  { key: 's8', stage: 1, title: 'ტომარა და მარცვალი',
    lines: r => [
      'ცეცხლი გამორთე. ტომარა ჩადე.',
      `ნელ-ნელა ჩაყარე და ურიე: ${startGrains(r).map(g => `${g.name} ${g.grams} გ`).join(', ') || '—'}.`,
      ...lateGrains(r).map(g => ({ text: `${g.name} ${g.grams} გ — ჯერ არა: ${grainMin(g)}-ე წუთზე (სიგნალი).`, later: true })),
      '1 წთ შემდეგ გაზომე ტემპერატურა.'
    ],
    inputs: [{ k: 'doughInTemp', label: 'ტემპერატურა', unit: '°C', step: 0.5, start: r => r.mashTemp }],
    gauge: r => mashGauge(r, 'doughInTemp'),
    feedback: (r, b) => mashFeedback(r, val(b, 'doughInTemp')),
    trouble: ['გუნდებია? ნიჩბით დაშალე კედელზე.', 'თერმომეტრი შუაში ჩაყავი, არა ძირზე.'] },
  { key: 's9', stage: 1, title: 'გაშაქრების ტაიმერი',
    lines: r => ['თავსახური დაახურე, ქვაბი პირსახოცით შეახვიე.', `ტაიმერი: ${r.mashMin} წთ.`,
      ...lateGrains(r).map(g => ({ text: `${grainMin(g)}-ე წუთზე: ${g.grams} გ ${g.name} (სიგნალი).`, later: true })),
      'სიგნალი: შუაზე, ბოლომდე 10 წთ-ით ადრე და ბოლოს.'],

    return bar('β-ამილაზა', 'g', beta, `${Math.round(beta)}%`) + bar('α-ამილაზა', 'b', alpha, `${Math.round(alpha)}%`)
      + bar('ფერმენტირება', '', ferm, `${ferm}%`) + bar('სხეული', 'b', 130 - ferm, v < 65 ? 'მშრალი' : v > 70 ? 'სავსე' : 'საშუალო');
  }
  const bitter = 100 * (1 - Math.exp(-v / 20)) / (1 - Math.exp(-3)), aroma = v === 0 ? 100 : clamp(100 * Math.exp(-v / 9), 2, 100);
  return bar('სიმწარე', '', bitter, `${Math.round(bitter)}%`) + bar('არომატი', 'g', aroma, `${Math.round(aroma)}%`);
}

/* რეფრაქტომეტრის კორექცია (Terrill), ალკოჰოლის არსებობისას */
function refractFG(ogBrix, fgBrix, wcf = 1.04) {
  const ob = ogBrix / wcf, fb = fgBrix / wcf;
  return 1 - 0.0044993 * ob + 0.011774 * fb + 0.00027581 * ob * ob - 0.0012717 * fb * fb
    - 0.0000072800 * ob ** 3 + 0.000063293 * fb ** 3;
}

/* =====================================================================
   4. მონაცემები (localStorage)
   ===================================================================== */
let S = load();

function freshState() {
  return { recipes: clone(DEFAULT_RECIPES), batches: [], settings: { debug: false, wake: true, read: [] } };
}
function migrate(s) {
  s = s && typeof s === 'object' ? s : {};
  s.recipes = Array.isArray(s.recipes) && s.recipes.length ? s.recipes : clone(DEFAULT_RECIPES);
  s.batches = Array.isArray(s.batches) ? s.batches : [];
  s.settings = Object.assign({ debug: false, wake: true, read: [] }, s.settings || {});
  if (!Array.isArray(s.settings.read)) s.settings.read = [];
  s.recipes.forEach(fixRecipe);
  s.batches.forEach(b => {
    Object.assign(b, Object.assign({
      readings: {}, stepsDone: {}, checks: {}, timers: {}, cur: 0, fermentationLog: [],
      instrument: 'hydro', notes: '', status: 'planned', created: Date.now()
    }, b));
    b.bottling = Object.assign({ fg: null, volume: null, sugar: null, bottles: null, size: 0.5, date: '', tasting: '' }, b.bottling || {});
    if (b.recipe) fixRecipe(b.recipe);
    b.fermentationLog = (b.fermentationLog || []).filter(e => e && (e.temp != null || e.airlock || e.foam || e.fg != null || e.note));
  });
  return s;
}
function fixRecipe(r) {
  r.grains = r.grains || []; r.hops = r.hops || [];
  r.grains.forEach(g => {
    // ძველი შენახული სტაუტი: Black ჩაიყრება 45-ე წუთზე
    if (g.minute == null) g.minute = (r.id === 'stout' && g.name === 'Black') ? 45 : 0;
  });
  r.yeast = Object.assign({ name: '', grams: 2, tempMin: 18, tempMax: 24 }, r.yeast || {});
  if (r.autoScale == null) r.autoScale = true;
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn(e); }
  return freshState();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
  catch (e) { toast('შენახვა ვერ მოხერხდა — მეხსიერება სავსეა?'); }
}

const getBatch = id => S.batches.find(b => b.id === id);
const getRecipe = id => S.recipes.find(r => r.id === id);
/* ხარშვის დაწყებისას რეცეპტი პარტიაში კოპირდება; ასლი ცალკე რედაქტირდება */
const recipeOf = b => b.recipe || getRecipe(b.recipeId) || S.recipes[0];
function val(b, k) { const r = b.readings[k]; return r ? r.value : null; }
function brewDay(b) { return b.stepsDone.s26 ? todayStr(new Date(b.stepsDone.s26)) : b.date; }

/* =====================================================================
   5. გამოთვლები
   ===================================================================== */
function calc(b, r) {
  const pot = val(b, 'potVol'), brix = val(b, 'brix'), ml = val(b, 'sampleMl') || 0;
  const c = { ready: false };
  if (pot == null || brix == null || brix <= 0) return c;
  const wortL = pot - ml / 1000;
  if (wortL <= 0) return c;
  const hopG = r.hops.reduce((s, h) => s + (+h.grams || 0), 0);
  // ერთი ვარიანტი: სამიზნე Brix → მოცულობა, წყალი, OG, ABV, სიმწარე
  const opt = tb => {
    const L = Math.max(Math.min(wortL * brix / tb, r.maxVolumeL), wortL);
    const fb = brix * wortL / L, og = sgFromBrix(fb);
    return { tb, L, add: L - wortL, finalBrix: fb, og, abv: (og - 1.010) * 131, bitter: hopG / L, capped: wortL * brix / tb > r.maxVolumeL, asIs: L === wortL };
  };
  const idealL = wortL * brix / r.targetBrix;
  const lowEff = (idealL - wortL) < 0.3, belowTarget = brix < r.targetBrix;
  // ვარიანტები: ასე დატოვება + სამიზნე და 1–3 Brix-ით ნაკლები (მხოლოდ თუ რეალური განზავებაა)
  const cands = [brix, r.targetBrix, r.targetBrix - 1, r.targetBrix - 2, r.targetBrix - 3].filter(tb => tb > 0 && tb <= brix);
  const seen = new Set(); const options = [];
  cands.forEach(tb => { const o = opt(tb); const k = o.L.toFixed(2); if (!seen.has(k)) { seen.add(k); options.push(o); } });
  options.forEach(o => { o.ok = o.bitter <= BITTER_HIGH_G_PER_L && o.abv >= 4; });
  // რეკომენდაცია: ნორმალური სიმწარე და ≥4% ABV, სამიზნესთან ყველაზე ახლოს; თუ არაა — ყველაზე რბილი
  const good = options.filter(o => o.ok).sort((a, z) => Math.abs(a.finalBrix - r.targetBrix) - Math.abs(z.finalBrix - r.targetBrix));
  // ვერცერთი არ გადის? — რეცეპტის სამიზნე (ან „ასე დატოვება", თუ Brix უკვე დაბალია), წყლიანი ლუდის ნაცვლად
  const rec = good[0] || options.find(o => o.tb === r.targetBrix) || options[0];
  const allBitter = options.every(o => o.bitter > BITTER_HIGH_G_PER_L);
  const planTb = val(b, 'planBrix');
  const chosen = options.find(o => planTb != null && Math.abs(o.tb - planTb) < 0.01) || rec;
  options.forEach(o => { o.rec = o === rec; o.chosen = o === chosen; });
  // ფაქტობრივი მოცულობა (ნაბიჯი 22) გეგმას ანაცვლებს: OG/ABV იმაზე ითვლება, რაც ფერმენტერშია
  const actualL = val(b, 'finalVol');
  const out = actualL && actualL >= wortL * 0.9 ? opt(brix * wortL / actualL) : chosen;
  if (out !== chosen) { out.L = actualL; out.finalBrix = brix * wortL / actualL; out.og = sgFromBrix(out.finalBrix); out.abv = (out.og - 1.010) * 131; out.bitter = hopG / actualL; }
  return {
    ready: true, wortL, brix, idealL, hopG, options, chosen, rec, lowEff, belowTarget, allBitter,
    vol: out.L, addL: chosen.add, finalBrix: out.finalBrix, og: out.og, abv: out.abv,
    bitter: out.bitter, bitterHigh: out.bitter > BITTER_HIGH_G_PER_L, capped: chosen.capped
  };
}

function mashGauge(r, k) { return { k, lo: r.mashTemp - 1, hi: r.mashTemp + 2, min: r.mashTemp - 10, max: r.mashTemp + 10, unit: '°C' }; }
function mashFeedback(r, t) {
  if (t == null) return [];
  if (t < r.mashTemp - 1) return [{ cls: 'warn', text: `დაბალია (${fmt(t)}°C): დაბალ ცეცხლზე, ურიე, ${r.mashTemp}°C-ზე გამორთე.` }];
  if (t > r.mashTemp + 2) return [{ cls: 'warn', text: `მაღალია (${fmt(t)}°C): თავსახური ღია, ურიე, ან 50–100 მლ ცივი წყალი.` }];
  return [{ cls: 'ok', text: `კარგია — სამიზნე ${r.mashTemp}°C.` }];
}

function yeastSuggest(r, b, c) {
  const v = val(b, 'finalVol') || (c.ready ? c.vol : null);
  return v ? Math.max(2, Math.round(v)) : Math.max(2, r.yeast.grams);
}

/* დადუღების გამოთვლები: OG, ბოლო FG, ABV, დასრულდა თუ არა */
function fermStats(b) {
  const r = recipeOf(b), c = calc(b, r);
  const fgs = b.fermentationLog.filter(e => e.fg != null).sort((a, z) => a.day - z.day);
  const last = fgs[fgs.length - 1], prev = fgs[fgs.length - 2];
  const st = { og: c.ready ? c.og : null, ogBrix: c.ready ? c.finalBrix : null, fgBrix: last ? last.fg : null };
  if (st.fgBrix != null) {
    st.fgSG = b.instrument === 'refract' && st.ogBrix != null ? refractFG(st.ogBrix, st.fgBrix) : sgFromBrix(st.fgBrix);
    if (st.og != null) st.abv = (st.og - st.fgSG) * 131;
  }
  st.finished = !!(last && prev && last.fg === prev.fg);
  st.fgCount = fgs.length;
  return st;
}

/* რეცეპტის შემოწმება რედაქტორისთვის */
function recipeIssues(r) {
  const out = [];
  if (!r.grains.length) out.push('მარცვალი არ არის.');
  if (r.grains.length && !startGrains(r).length) out.push('ერთი მარცვალი მაინც 0-ე წუთზე უნდა ჩაიყაროს.');
  r.grains.forEach(g => { if (grainMin(g) >= r.mashMin) out.push(`${g.name || 'მარცვალი'} ${grainMin(g)}-ე წუთზე — გაშაქრება ${r.mashMin} წთ-ია, ვერ ჩაიყრება.`); });
  r.hops.forEach(h => { if (h.minute > r.boilMin) out.push(`${h.name || 'სვია'} @${h.minute} წთ — ხარშვაზე (${r.boilMin} წთ) მეტია; ჩაიყრება დასაწყისში.`); });
  if (r.yeast.tempMin >= r.yeast.tempMax) out.push('საფუარის მინ. ტემპერატურა მაქსიმუმზე ნაკლები უნდა იყოს.');
  if (r.mashWaterL > POT_SAFE_L) out.push(`გაშაქრების წყალი ${r.mashWaterL} ლ — 5 ლ ქვაბისთვის ბევრია.`);
  if (r.maxVolumeL > POT_L) out.push(`მაქს. მოცულობა ${r.maxVolumeL} ლ ფერმენტერს (5 ლ) აჭარბებს.`);
  return out;
}

/* =====================================================================
   6. ტაიმერები, ხმა, შეტყობინებები, Wake Lock
   ===================================================================== */
let actx = null, beepTimeout = null;
const alertQueue = [];

function ensureAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { /* ხმა მიუწვდომელია */ }
}
/* სამი სერია სამ-სამი ბიპით (Web Audio, გარე ფაილის გარეშე) */
function playAlarm() {
  stopAlarm();
  let round = 0;
  const play = () => {
    if (actx) {
      const t0 = actx.currentTime;
      for (let k = 0; k < 3; k++) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = k === 2 ? 1320 : 990;
        g.gain.setValueAtTime(0.0001, t0 + k * 0.28);
        g.gain.exponentialRampToValueAtTime(0.5, t0 + k * 0.28 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + k * 0.28 + 0.2);
        o.connect(g).connect(actx.destination);
        o.start(t0 + k * 0.28); o.stop(t0 + k * 0.28 + 0.22);
      }
    }
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    if (++round < 3) beepTimeout = setTimeout(play, 1600);
  };
  play();
}
function stopAlarm() { clearTimeout(beepTimeout); beepTimeout = null; if (navigator.vibrate) navigator.vibrate(0); }

function askNotify() {
  if ('Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) { /* ignore */ }
  }
}
function notify(text) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('ხარშვის ასისტენტი', { body: text, tag: 'brew', renotify: true }); } catch (e) { /* ignore */ }
  }
}

function startTimer(b, id) {
  ensureAudio(); askNotify();
  const min = TIMERS[id].minutes(recipeOf(b));
  const unit = S.settings.debug ? DEBUG_TIMER_MS / min : 60000;   // ms ერთ "წუთზე"
  b.timers[id] = { startedAt: Date.now(), endAt: Date.now() + min * unit, unit, minutes: min, paused: false, rem: null, fired: [], done: false };
  save();
}
const remaining = t => t.paused ? t.rem : t.endAt - Date.now();
function togglePause(t) {
  if (t.paused) { t.endAt = Date.now() + t.rem; t.paused = false; t.rem = null; }
  else { t.rem = t.endAt - Date.now(); t.paused = true; }
}
function adjustTimer(b, id, dMin) {
  const t = b.timers[id];
  const d = dMin * t.unit;
  if (t.paused) t.rem = Math.max(0, t.rem + d);
  else t.endAt = Math.max(Date.now(), t.endAt + d);
  // თუ დრო დაემატა, სიგნალები, რომლებიც ჯერ არ უნდა მომხდარიყო, თავიდან აქტიურდება
  const rem = remaining(t);
  const alerts = TIMERS[id].alerts(recipeOf(b));
  t.fired = t.fired.filter(key => { const a = alerts.find(x => alertKey(x) === key); return a && rem <= a.at * t.unit; });
  if (rem > 0) t.done = false;
}
const alertKey = a => `${a.at}|${a.msg}`;

/* ყოველ 0.5 წამში: ტაიმერების შემოწმება და ეკრანის განახლება */
function tick() {
  let changed = false;
  for (const b of S.batches) {
    for (const id in b.timers) {
      const t = b.timers[id];
      if (!t || t.done || !TIMERS[id]) continue;
      const rem = remaining(t);
      for (const a of TIMERS[id].alerts(recipeOf(b))) {
        const key = alertKey(a);
        if (!t.fired.includes(key) && rem <= a.at * t.unit) {
          t.fired.push(key); changed = true;
          pushAlert({ batchId: b.id, timerId: id, msg: a.msg, step: a.step, check: a.check, label: TIMERS[id].label });
        }
      }
      if (rem <= 0 && !t.paused) { t.done = true; changed = true; }
    }
  }
  if (changed) save();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const [bid, id] = el.dataset.timer.split(':');
    const b = getBatch(bid); const t = b && b.timers[id];
    if (!t) return;
    const rem = remaining(t), total = t.minutes * t.unit;
    if (el.classList.contains('digits')) {
      el.textContent = fmtMs(rem);
      el.classList.toggle('paused', !!t.paused);
      el.classList.toggle('over', rem <= 0);
    } else if (el.tagName === 'I') {
      el.style.width = `${clamp(100 - rem / total * 100, 0, 100)}%`;
    } else if (changed && el.classList.contains('alerts')) {
      el.innerHTML = alertsHtml(b, id);
    }
  });
}

function pushAlert(a) {
  alertQueue.push(a);
  notify(a.msg);
  playAlarm();
  renderOverlay();
}
function renderOverlay() {
  const o = $('#overlay');
  const a = alertQueue[0];
  if (!a) { o.classList.remove('on'); o.innerHTML = ''; return; }
  const b = getBatch(a.batchId), t = b && b.timers[a.timerId];
  o.innerHTML = `
    <div class="ring">${ic('timer')}</div>
    <div class="cap">${esc(a.label)}${alertQueue.length > 1 ? `, კიდევ ${alertQueue.length - 1}` : ''}</div>
    <div class="big">${esc(a.msg)}</div>
    ${t ? `<div class="sec" style="align-items:center;gap:2px"><span class="muted small">ტაიმერი გრძელდება</span><span class="digits" style="font-size:3rem" data-timer="${b.id}:${a.timerId}">${fmtMs(remaining(t))}</span></div>` : ''}
    <button class="primary" data-act="alertDone" style="min-height:68px;font-size:1.2rem">${ic('check')} შესრულდა</button>`;
  o.classList.add('on');
}

let wakeLock = null;
async function applyWake() {
  const want = S.settings.wake && route().name === 'brew' && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* შემდეგი მოქმედება პარტიის ბარათზე */
function batchNext(b) {
  const today = todayStr();
  switch (b.status) {
    case 'planned': return { text: `დაგეგმილი: ${fmtDate(b.date)}`, pct: 0 };
    case 'brewing': return { text: `ნაბიჯი ${b.cur + 1}/${STEPS.length}: ${STEPS[b.cur].title}`, pct: (b.cur + 1) / STEPS.length * 100 };
    case 'fermenting': {
      const d = daysBetween(brewDay(b), today);
      const lastDay = Math.max(-1, ...b.fermentationLog.map(e => e.day));
      const next = FERM_DAYS.find(x => x > lastDay && x >= d) ?? FERM_DAYS.find(x => x > lastDay);
      const fs = fermStats(b);
      return { text: fs.finished ? 'დადუღება დასრულდა — cold crash და ჩამოსხმა' : `დადუღების ${Math.max(d, 0)}-ე დღე${next != null ? `, შემდეგი ჩანაწერი: დღე ${next}` : ', დროა FG-ს'}`, pct: clamp(d / 11 * 100, 0, 100) };
    }
    case 'bottled': return { text: b.bottling.date ? `ჩამოსხმულია ${fmtDate(b.bottling.date)}, გასინჯე ${fmtDate(addDays(b.bottling.date, 14))}-ს` : 'ჩამოსხმული', pct: 100 };
    default: return { text: 'დასრულებული', pct: 100 };
  }
}
/* ჭიქის შევსება = პარტიის პროგრესი */
function batchFill(b) {
  return { planned: 0.1, brewing: 0.12 + 0.55 * (b.cur / STEPS.length), fermenting: 0.8, bottled: 0.92, done: 0.92 }[b.status] ?? 0.5;
}

      ${listRow(null, 'flame', 'ხარშვის დღე', started ? `ნაბიჯი ${b.cur + 1} / ${STEPS.length}` : '26 ნაბიჯი, 8 ეტაპი', 'openBrew')}
      ${listRow(`#/ferm/${b.id}`, 'bubbles', 'დადუღების დღიური', fs.finished ? 'FG სტაბილურია' : `დღეები ${FERM_DAYS.join(', ')}`)}
      ${listRow(`#/bottle/${b.id}`, 'bottle', 'ჩამოსხმა', b.bottling.volume ? `${b.bottling.volume} ლ, ${Math.floor(b.bottling.volume / (b.bottling.size || 0.5))} × ${b.bottling.size || 0.5} ლ, შაქარი ${fmt(b.bottling.volume * SUGAR_G_PER_L)} გ` : 'შაქარი, ჩეკლისტი, გემო')}
      ${listRow(`#/export/${b.id}`, 'doc', 'ექსპორტი', 'Markdown ტექსტი კოპირებისთვის')}
    </nav>

    <section class="panel">
      <div class="sec-head"><h2>${ic('book')} რეცეპტი</h2></div>
      <a class="batch paper" href="${editHref}" aria-label="რეცეპტის რედაქტირება">
        <div class="top"><span class="name" style="font-size:1.2rem">${esc(r.name)}</span>${ic('edit')}</div>
        <div class="small muted">${r.grains.map(grainLabel).join(', ')}</div>
        <div class="small muted">${r.hops.map(h => `${esc(h.name)} ${h.grams} გ @${h.minute}`).join(', ')}; ${esc(r.yeast.name)}</div>
        <div class="spec"><span>გაშაქრება<b>${r.mashTemp}°</b> × ${r.mashMin} წთ</span><span>ხარშვა<b>${r.boilMin}</b> წთ</span><span>Brix<b>${r.targetBrix}</b></span></div>
      </a>
      ${b.recipe ? '<p class="small muted">ხარშვის დაწყებისას რეცეპტი ამ პარტიაში დაკოპირდა. მისი ცვლილება ბიბლიოთეკის რეცეპტს არ ეხება.</p>'
        : `<label class="field"><span class="lbl">სხვა რეცეპტის არჩევა</span><select id="b-recipe" data-bind="batch:recipeId">${S.recipes.map(x => `<option value="${x.id}" ${x.id === b.recipeId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`}
    </section>

    <section class="panel">
      <h2>დეტალები</h2>
      <label class="field"><span class="lbl">სახელი</span><input id="b-name" data-bind="batch:name" value="${esc(b.name)}"></label>
      <div class="grid2">
        <label class="field"><span class="lbl">თარიღი</span><input id="b-date" type="date" data-bind="batch:date" value="${esc(b.date)}"></label>
        <label class="field"><span class="lbl">სტატუსი</span><select id="b-status" data-bind="batch:status">
          ${Object.keys(STATUS).map(s => `<option value="${s}" ${s === b.status ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span class="lbl">შენიშვნები</span><textarea id="b-notes" data-bind="batch:notes" placeholder="რა გამოვიდა კარგად, რას შეცვლი შემდეგ ჯერზე">${esc(b.notes)}</textarea></label>
    </section>

    ${started ? `<details><summary>${ic('list')} ყველა ნაბიჯი${ic('chev', 'chev')}</summary><div class="inner"><div class="checks">${STEPS.map((s, i) => `
      <button type="button" class="list-row" style="min-height:52px;padding:8px 2px" data-act="goStep" data-i="${i}">
        ${ic(b.stepsDone[s.key] ? 'check' : (i === b.cur ? 'chev' : 'minus'), 'lead')}<span class="body"><span>${i + 1}. ${s.title}</span></span></button>`).join('')}</div></div></details>
      <details><summary>${ic('doc')} ხარშვის შეჯამება${ic('chev', 'chev')}</summary><div class="inner">${renderSummary(b)}</div></details>` : ''}
    <button class="danger" data-act="deleteBatch">${ic('trash')} პარტიის წაშლა</button>
  </main>${tabbar('home')}`;
}

/* --- 8.4 ხარშვის რეჟიმი (ნაბიჯ-ნაბიჯ) --- */
function viewBrew(b) {
  const r = recipeOf(b);
  const i = clamp(b.cur, 0, STEPS.length - 1);
  const st = STEPS[i], c = calc(b, r);
  const stage = STAGES[st.stage];
  const done = b.stepsDone[st.key];
  const checks = st.checklist ? st.checklist(r) : [];
  // ეტაპების ზოლი: თითო ეტაპის შიგნით შევსება ნაბიჯების მიხედვით
  const segs = STAGES.map((_, si) => {
    const idx = STEPS.map((s, k) => s.stage === si ? k : -1).filter(k => k >= 0);
    const fill = i > idx[idx.length - 1] ? 100 : i < idx[0] ? 0 : ((i - idx[0] + 1) / idx.length) * 100;
    return `<div><i style="width:${fill}%;background:${STAGES[si].color}"></i></div>`;
  }).join('');
  // გაშვებული ტაიმერი, რომელიც ამ ნაბიჯზე არ ჩანს — პატარა ჩიპად ზედა ზოლში
  const chips = Object.keys(b.timers).filter(id => b.timers[id] && !b.timers[id].done && id !== st.timer)
    .map(id => `<span class="tchip">${ic('timer')}<span class="digits chip-d" data-timer="${b.id}:${id}">--:--</span></span>`).join('');
  const next = STEPS[i + 1];
  return `
  <header class="brewbar" style="--stage:${stage.color}"><div class="wrap">
    <div class="row1">
      <button class="icon-btn" data-act="goBatch" aria-label="პარტიაზე დაბრუნება">${ic('back')}</button>
      <button class="where-btn" data-act="openMap" aria-label="ნაბიჯების რუკა"><span class="eyebrow">${ic('map')} ეტაპი ${st.stage + 1}/${STAGES.length}${debugTag()}</span><b>${stage.letter}. ${stage.name}</b></button>
      ${chips}
      <button class="icon-btn ${S.settings.wake ? 'on' : ''}" data-act="toggleWake" aria-pressed="${S.settings.wake}" aria-label="ეკრანი არ დაიძინოს">${ic(S.settings.wake ? 'sun' : 'moon')}</button>
    </div>
    <div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${i + 1}" data-act="openMap">${segs}</div>
  </div></header>
  <main class="wrap brew enter" style="--stage:${stage.color}">
    <div class="stage-row">
      ${sealSvg(stage.letter, `${stage.name} ✦ ეტაპი ${st.stage + 1} ✦ ${stage.name} ✦ `, { fs: 46 })}
      <div class="txt">
        <span class="eyebrow num">ნაბიჯი ${i + 1} / ${STEPS.length}</span>
        <h1>${st.title}</h1>
        ${STEPS.findIndex(s => s.stage === st.stage) === i ? `<span class="intro">${esc(stage.intro)}</span>` : ''}
      </div>
    </div>
    <section class="paper label-cut panel" style="gap:14px"><ul class="instr">${st.lines(r, b, c).map(l => typeof l === 'string'
      ? `<li><span>${esc(l)}</span></li>` : `<li class="${l.later ? 'later' : ''}"><span>${esc(l.text)}</span></li>`).join('')}</ul>
    ${st.custom ? `<div id="custom" class="sec">${st.custom(r, b, c)}</div>` : ''}
    ${(st.inputs || []).length ? '<div class="rule-ink"></div>' : ''}
    ${(st.inputs || []).map(inp => readingHtml(b, inp)).join('')}
    <div id="live" class="sec">${liveHtml(st, r, b, c)}</div></section>
    ${checks.length ? checklistHtml(st.checklistKey || st.key, checks, b, st.checklistTitle).replace('class="panel"', 'class="paper panel"') : ''}
    ${st.timer ? timerHtml(b, st.timer).replace('class="panel hl timer"', 'class="paper panel timer"') : ''}
    ${st.trouble ? `<details class="trouble"><summary>${ic('alert')} თუ რამე ისე არ არის${ic('chev', 'chev')}</summary><div class="inner"><ul>${st.trouble.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></details>` : ''}
    ${STAGE_LESSON[st.stage] ? inlineLesson(STAGE_LESSON[st.stage]) : ''}
    ${done ? `<span class="stamp">${ic('check')} შესრულდა ${fmtTime(done)}</span>` : ''}
    ${next ? `<div class="nextup">${ic('chev')} შემდეგი: <b>${i + 2}. ${next.title}</b></div>` : ''}
  </main>
  <div class="actionbar"><div class="wrap">
    <button class="icon-btn" data-act="stepBack" ${i === 0 ? 'disabled' : ''} aria-label="წინა ნაბიჯი">${ic('back')}</button>
    <button data-act="stepSkip">გამოტოვება</button>
    <button class="primary ${st.gate && st.gate(r, b, c) ? 'gated' : ''}" id="doneBtn" data-act="stepDone">${ic('check')} ${st.doneLabel || 'შესრულდა'}</button>
  </div></div>${tabbar('home', 'desk-only')}`;
}

function readingHtml(b, inp) {
  const v = b.readings[inp.k];
  return `<div class="reading">
    <label class="lbl" for="rd-${inp.k}"><span>${inp.label}</span><span id="rdt-${inp.k}" class="num">${v ? fmtTime(v.time) : ''}</span></label>
    <div class="stepper">
      <button type="button" data-act="nudge" data-k="${inp.k}" data-d="-1" aria-label="შემცირება">${ic('minus')}</button>
      ${unitInput(`id="rd-${inp.k}" data-bind="reading:${inp.k}"`, v && v.value != null ? v.value : '', inp.unit)}
      <button type="button" data-act="nudge" data-k="${inp.k}" data-d="1" aria-label="გაზრდა">${ic('plus')}</button>
    </div></div>`;
}

/* სკალა: მწვანე ზოლი = სწორი დიაპაზონი, ხაზი = შენი ციფრი */
function gaugeHtml(g, v) {
  const p = x => clamp((x - g.min) / (g.max - g.min) * 100, 0, 100);
  const inBand = v != null && v >= g.lo && v <= g.hi;
  const lbl = (x, cls = '') => `<span class="${cls}" style="left:${p(x)}%">${fmt(x)}</span>`;
  return `<div class="gauge" aria-hidden="true">
    <div class="track"><div class="band" style="left:${p(g.lo)}%;width:${p(g.hi) - p(g.lo)}%"></div>
      ${v != null ? `<div class="mark ${inBand ? '' : 'out'}" style="left:${p(v)}%"></div>` : ''}</div>
    <div class="scale">${g.lo > g.min ? lbl(g.min, 'start') : ''}${lbl(g.lo, g.lo <= g.min ? 'start' : '')}${lbl(g.hi)}${lbl(g.max, 'end')}</div>
  </div>`;
}

/* ცოცხალი ბლოკი: სკალა, გაფრთხილებები და პირობა გაგრძელებისთვის */
function liveHtml(st, r, b, c) {
  const g = st.gauge ? st.gauge(r) : null;
  const fb = st.feedback ? st.feedback(r, b, c) : [];
  const gate = st.gate ? st.gate(r, b, c) : null;
  return (g ? gaugeHtml(g, val(b, g.k)) : '')
    + fb.map(f => msgHtml(f.cls, f.text)).join('')
    + (gate && !fb.length ? msgHtml('info', gate) : '');
}
function refreshBrewLive(b) {
  const r = recipeOf(b), st = STEPS[b.cur], c = calc(b, r);
  const live = $('#live'); if (live) live.innerHTML = liveHtml(st, r, b, c);
  const btn = $('#doneBtn'); if (btn) btn.classList.toggle('gated', !!(st.gate && st.gate(r, b, c)));
  if ($('#custom') && st.custom) $('#custom').innerHTML = st.custom(r, b, c);
  (st.inputs || []).forEach(inp => { const el = $(`#rdt-${inp.k}`); const v = b.readings[inp.k]; if (el) el.textContent = v ? fmtTime(v.time) : ''; });
}

function alertsHtml(b, id) {
  const t = b.timers[id], r = recipeOf(b);
  const unit = t ? t.unit : 60000;
  return TIMERS[id].alerts(r).map(a => {
    const fired = t && t.fired.includes(alertKey(a));
    return `<div class="${fired ? 'fired' : ''}"><span class="num">${fmtMs(a.at * unit)}</span><span>${esc(a.msg)}</span></div>`;
  }).join('');
}
function timerHtml(b, id) {
  const t = b.timers[id], r = recipeOf(b), def = TIMERS[id];
  const min = t ? t.minutes : def.minutes(r);
  const marks = def.alerts(r).filter(a => a.at > 0 && a.at < min).map(a => {
    const fired = t && t.fired.includes(alertKey(a));
    return `<b class="${fired ? 'fired' : ''}" style="left:${100 - a.at / min * 100}%"></b>`;
  }).join('');
  const head = `<div class="head"><span class="lbl">${ic('timer')} ${def.label} · ${min} წთ</span>${S.settings.debug ? '<span class="debug">10 წმ</span>' : ''}</div>`;
  if (!t) {
    return `<section class="panel hl timer">${head}
      <div class="digits paused">${fmtMs(min * 60000)}</div>
      <div class="tbar">${marks}</div>
      <div class="alerts">${alertsHtml(b, id)}</div>
      <button class="primary" data-act="timerStart" data-t="${id}">${ic('play')} ტაიმერის დაწყება</button></section>`;
  }
  return `<section class="panel hl timer">${head}
    <div class="digits" data-timer="${b.id}:${id}" role="timer">${fmtMs(remaining(t))}</div>
    <div class="tbar"><i data-timer="${b.id}:${id}" style="width:0"></i>${marks}</div>
    <div class="alerts" data-timer="${b.id}:${id}">${alertsHtml(b, id)}</div>
    <div class="btn-row">
      <button data-act="timerAdj" data-t="${id}" data-d="-1">−1 წთ</button>
      <button data-act="timerPause" data-t="${id}">${ic(t.paused ? 'play' : 'pause')} ${t.paused ? 'გაგრძელება' : 'პაუზა'}</button>
      <button data-act="timerAdj" data-t="${id}" data-d="1">+1 წთ</button>
    </div>
    <button class="ghost small" data-act="timerReset" data-t="${id}" style="min-height:44px;color:var(--muted)">${ic('reset')} თავიდან დაწყება</button>
  </section>`;
}

function renderCalc(r, b, c) {
  if (!c.ready) return msgHtml('warn', 'შეიყვანე მოცულობა ქვაბში და Brix (ნაბიჯები 19–20).');
  const ch = c.chosen;
  // 1. რა მოხდა — ერთი აბზაცი
  let verdict;
  if (c.belowTarget) verdict = `${fmt(c.wortL, 2)} ლ ტკბილი გამოვიდა ${fmt(c.brix)} Brix-ით — სამიზნე ${r.targetBrix}-ზე ნაკლები. შაქარი ცოტაა, წყალი არ დაამატო: ლუდი უფრო მსუბუქი გამოვა (~${fmt(c.abv)}%), მაგრამ კარგი.`;
  else if (c.lowEff) verdict = `${fmt(c.wortL, 2)} ლ ტკბილი გამოვიდა ${fmt(c.brix)} Brix-ით. რეცეპტი ${r.maxVolumeL} ლ-ს ითვალისწინებდა — მარცვლიდან მოსალოდნელზე ნაკლები შაქარი ამოვიდა (ალბათ უხეში დაფქვა ან დაბალი ტემპერატურა გაშაქრებისას). ახლა არჩევანია: ნაკლები ლუდი სავსე გემოთი, თუ მეტი ლუდი — მსუბუქი.`;
  else verdict = `${fmt(c.wortL, 2)} ლ ტკბილი ${fmt(c.brix)} Brix-ით — გეგმისამებრ. წყლით ${fmt(ch.L, 2)} ლ-მდე გავაზავებთ და ${fmt(ch.finalBrix)} Brix დარჩება.`;
  const bitterNote = c.allBitter
    ? `სიმწარე: ${fmt(c.hopG)} გ სვია ამ მოცულობისთვის ბევრია — ყველა ვარიანტში ${BITTER_HIGH_G_PER_L} გ/ლ-ზე მეტი გამოდის. ლუდი მწარე იქნება, მაგრამ ეს ხარვეზი არ არის. შემდეგ ჯერზე სვია შეამცირე ან მეტი ტკბილი მოხარშე.`
    : ch.bitter > BITTER_HIGH_G_PER_L
    ? `სიმწარე: ${fmt(c.hopG)} გ სვია ${fmt(ch.L, 2)} ლ-ზე = ${fmt(ch.bitter, 2)} გ/ლ — ლუდი მოსალოდნელზე უფრო მწარე იქნება. მეტი წყალი არბილებს.`
    : `სიმწარე ${fmt(ch.bitter, 2)} გ/ლ — ნორმაშია.`;
  // 2. ვარიანტები
  const cards = c.options.map(o => {
    const title = o.asIs ? 'ასე დავტოვოთ' : `განზავება ${o.tb} Brix-მდე`;
    const ch2 = o.tb >= r.targetBrix + 1 ? 'მაგარი და სავსე' : o.tb === r.targetBrix ? 'რეცეპტის მიხედვით' : 'მსუბუქი, მეტი ლუდი';
    return `<button type="button" class="opt ${o.chosen ? 'on' : ''}" data-act="pickPlan" data-tb="${o.tb}" aria-pressed="${o.chosen}">
      <span class="opt-h"><b>${title}</b>${o.rec ? '<span class="tag">რეკომენდაცია</span>' : ''}</span>
      <span class="opt-n"><span><i>${fmt(o.L, 2)}</i> ლ</span><span><i>${o.add > 0.004 ? '+' + mlRound(o.add) : '0'}</i> მლ წყალი</span><span><i>~${fmt(o.abv)}</i>% ABV</span><span><i>${fmt(o.bitter, 2)}</i> გ/ლ ${o.bitter > BITTER_HIGH_G_PER_L ? '↑' : ''}</span></span>
      <span class="opt-c">${ch2}${o.capped ? ', ფერმენტერი სავსეა' : ''}${o.bitter > BITTER_HIGH_G_PER_L ? ', მწარე' : ''}</span></button>`;
  }).join('');
  return `<p>${esc(verdict)}</p><p class="muted small">${esc(bitterNote)}</p>
    ${c.options.length > 1 ? `<h3>აირჩიე გეგმა</h3><div class="opts">${cards}</div>` : ''}
    <section class="panel" style="background:rgba(26,18,11,.05);border-color:rgba(26,18,11,.18);box-shadow:none">
      <div class="stat"><span class="cap">არჩეული გეგმა: ${ch.asIs ? 'წყლის გარეშე' : `დაამატე წყალი`}</span><span class="big">${mlRound(ch.add)} მლ</span><span class="cap">საბოლოო მოცულობა ${fmt(ch.L, 2)} ლ, ${fmt(ch.finalBrix)} Brix</span></div>
      <div class="tiles">
        <div class="tile"><span class="k">OG</span><span class="v">${ch.og.toFixed(3)}</span></div>
        <div class="tile"><span class="k">ABV ~</span><span class="v">${fmt(ch.abv)}%</span></div>
        <div class="tile ${ch.bitter > BITTER_HIGH_G_PER_L ? 'warn' : ''}"><span class="k">სიმწარე, გ/ლ</span><span class="v">${fmt(ch.bitter, 2)}</span></div>
      </div></section>
    ${ch.capped ? msgHtml('info', `მოცულობა ${r.maxVolumeL} ლ-ზე შეზღუდულია — ფერმენტერში მეტი არ ეტევა, ამიტომ Brix სამიზნეზე მაღალი რჩება.`) : ''}`;
}

/* ხარშვის დღის შეჯამება: ნაბიჯები, დრო, ციფრები */
function stepValues(b, st) {
  return (st.inputs || []).map(inp => { const v = val(b, inp.k); return v != null ? `${inp.label}: ${v} ${inp.unit}` : null; }).filter(Boolean).join('; ');
}
function renderSummary(b) {
  const r = recipeOf(b), c = calc(b, r);
  const rows = STEPS.filter(s => b.stepsDone[s.key] || stepValues(b, s));
  return `${c.ready ? `<div class="tiles">
      <div class="tile"><span class="k">OG</span><span class="v">${c.og.toFixed(3)}</span></div>
      <div class="tile"><span class="k">მოცულობა</span><span class="v">${fmt(val(b, 'finalVol') || c.vol, 2)} ლ</span></div>
      <div class="tile"><span class="k">ABV ~</span><span class="v">${fmt(c.abv)}%</span></div></div>` : ''}
    ${rows.length ? `<div class="tablewrap"><table><tr><th>ნაბიჯი</th><th>დრო</th><th>ციფრი</th></tr>
    ${rows.map(s => `<tr><td>${STEPS.indexOf(s) + 1}. ${s.title}</td><td class="n">${fmtTime(b.stepsDone[s.key])}</td><td>${esc(stepValues(b, s))}</td></tr>`).join('')}
    </table></div>` : '<p class="muted small">ჯერ ჩანაწერი არ არის.</p>'}`;
}

/* --- 8.5 დადუღების დღიური --- */
function ensureFerm(b, day) {
  let e = b.fermentationLog.find(x => x.day === day);
  if (!e) {
    e = { day, date: addDays(brewDay(b), day), temp: null, airlock: '', foam: '', note: '', fg: null };
    b.fermentationLog.push(e); b.fermentationLog.sort((a, z) => a.day - z.day);
  }
  return e;
}
/* ჩანაწერის შეფასება: რა არის ნორმალური ამ დღეს და რა — არა */
function assessFerm(b, e) {
  const r = recipeOf(b), c = calc(b, r);
  const pts = []; const add = (cls, text) => pts.push({ cls, text });
  const earlier = b.fermentationLog.filter(x => x.day < e.day).sort((x, y) => x.day - y.day);
  const wasActive = earlier.some(x => x.airlock === 'აქტიური' || x.foam);
  const { tempMin: lo, tempMax: hi, name: yname } = r.yeast;
  // ტემპერატურა
  if (e.temp != null) {
    if (e.temp > hi + 2) add('bad', `${fmt(e.temp)}°C ზედმეტად ცხელია — ${yname}-ს ${lo}–${hi}°C უნდა. გადადგი გრილ ადგილას (ნიჟარაში სველი პირსახოცით შეხვევა 2–3°C-ით აცივებს). ცხელზე საფუარი აცეტონის და მძაფრ ხილის სუნს ქმნის.`);
    else if (e.temp > hi) add('warn', `${fmt(e.temp)}°C დიაპაზონის ზევითაა (${lo}–${hi}°C). 1–2°C აქტიური დუღილის თვითგაცხელებაა — ოდნავ გრილ ადგილას გადადგი.`);
    else if (e.temp < lo - 2) add('bad', `${fmt(e.temp)}°C ცივია — ${yname} ${lo}°C-ს ქვემოთ ნელდება და შეიძლება გაჩერდეს. თბილ ოთახში გადაიტანე, ფერმენტერი პირსახოცით შეახვიე.`);
    else if (e.temp < lo) add('warn', `${fmt(e.temp)}°C დიაპაზონის ქვემოთაა (${lo}–${hi}°C). დუღილი უფრო ნელი და სუფთა იქნება; თუ შეგიძლია, 1–2°C-ით გაათბე.`);
    else add('ok', `${fmt(e.temp)}°C — ${yname}-ს დიაპაზონშია (${lo}–${hi}°C).`);
  } else add('info', 'ტემპერატურა არ ჩაგიწერია — ეს ყველაზე მნიშვნელოვანი ციფრია დუღილისას.');
  // საკეტი და ქაფი დღის მიხედვით
  const air = e.airlock;
  if (e.day <= 1) {
    if (air === 'აქტიური' || e.foam) add('ok', 'უკვე დაიწყო — სწრაფი სტარტი, საფუარი ჯანმრთელია.');
    else add('ok', 'პირველი დღე: ლაგი-ფაზაა. საფუარი ჟანგბადს იყენებს და მრავლდება; სიჩუმე 24 საათამდე ნორმალურია.');
  } else if (e.day <= 3) {
    if (air === 'აქტიური') add('ok', 'აქტიური დუღილი — ზუსტად ის, რაც ამ დღეს უნდა იყოს.');
    else if (air === 'ნელი') add(wasActive || e.day === 3 ? 'ok' : 'warn', wasActive || e.day === 3 ? 'ნელდება — Kveik-ს ძირითადი სამუშაო 2–3 დღეში უთავდება.' : 'ჯერ ნელია. შეამოწმე ტემპერატურა (ცივია?) და თავსახურის ჰერმეტულობა.');
    else if (air === 'გაჩერდა') add(wasActive ? 'ok' : 'bad', wasActive ? 'ძირითადი დუღილი დასრულდა. ახლა საფუარი ასუფთავებს და ლექდება — თავსახური არ ახადო.' : 'დუღილი არ ჩანს. ჯერ შეამოწმე, გადის თუ არა გაზი გვერდიდან: თავსახური, grommet, საკეტის წყალი. თუ ქაფია — ყველაფერი რიგზეა და უბრალოდ გაჟონავს. თუ ქაფიც არ არის და ტემპერატურა დიაპაზონშია, 12 საათი კიდევ დაელოდე; მერე საფუარი ხელახლა მოაყარე.');
    else add('info', 'საკეტის მდგომარეობა მონიშნე — 2–3 დღეს ეს დუღილის მთავარი ნიშანია.');
    if (!e.foam && air !== 'აქტიური' && e.day >= 2) add('warn', 'ქაფი (krausen) არ ჩანს. 2–3 დღეს ზედაპირზე ქაფის ქუდი უნდა იდგეს.');
    else if (e.foam) add('ok', `ქაფი: ${e.foam} — საფუარი მუშაობს.`);
  } else {
    if (air === 'აქტიური') add('ok', 'ჯერ კიდევ აქტიურია — დაელოდე, FG ჯერ ადრეა.');
    else if (air === 'ნელი' || air === 'გაჩერდა') add('ok', 'ბოლო ფაზა: დუღილი თითქმის დასრულდა, საფუარი ლექდება. სწორედ ამ დღეებში იზომება FG.');
    if (e.foam && e.day >= 7) add('info', 'ქაფი ჯერ კიდევ დგას — ბოლომდე ჩამოსვლას 1–2 დღე სჭირდება.');
  }
  // FG
  let finished = false;
  if (e.fg != null) {
    const ogB = c.ready ? c.finalBrix : null;
    const prevFg = [...earlier].reverse().find(x => x.fg != null);
    if (ogB == null) add('info', `FG ${e.fg} Bx ჩაწერილია, მაგრამ OG არ არის — ABV ვერ დავითვალე.`);
    else {
      const ratio = e.fg / ogB;
      const fgSG = b.instrument === 'refract' ? refractFG(ogB, e.fg) : sgFromBrix(e.fg);
      const abv = (c.og - fgSG) * 131;
      if (prevFg && e.fg > prevFg.fg + 0.3) add('warn', `FG გაიზარდა (${prevFg.fg} → ${e.fg})? ეს შეუძლებელია — ალბათ ნიმუში თბილი იყო ან ქაფიანი. გააცივე 20°C-მდე და გაზომე ხელახლა.`);
      else if (e.day < 5) add('info', `FG ${e.fg} Bx მე-${e.day} დღეს — ადრეა, ციფრი კიდევ დაიწევს. საბოლოო FG მე-7 დღიდან იზომება.`);
      else if (ratio > 0.6) add('warn', `FG ${e.fg} Bx ჯერ მაღალია (OG ${fmt(ogB)} Bx-ის ${Math.round(ratio * 100)}%). დუღილი შუაშია — შეამოწმე ტემპერატურა და 2 დღეში გაზომე ხელახლა.`);
      else if (prevFg && Math.abs(prevFg.fg - e.fg) <= 0.2) { finished = true; add('ok', `FG სტაბილურია (${prevFg.fg} → ${e.fg} Bx): დადუღება დასრულდა. ABV ≈ ${fmt(abv)}%. შემდეგი: 2 დღე მაცივარში (cold crash), მერე ჩამოსხმა.`); }
      else add('info', `FG ${e.fg} Bx — ABV ამ ეტაპზე ≈ ${fmt(abv)}%. ხელახლა გაზომე 2 დღეში: თუ იგივე ციფრია, დასრულებულია და ჩამოსხმა შეგიძლია.`);
    }
  } else if (e.day >= 7) add('info', 'მე-7 დღიდან FG-ს გაზომვის დროა: ნიმუში ცილინდრში, 20°C-ზე, Brix ჩაწერე.');
  const level = pts.some(x => x.cls === 'bad') ? 'bad' : pts.some(x => x.cls === 'warn') ? 'warn' : 'ok';
  const title = { ok: 'ყველაფერი რიგზეა', warn: 'შეამოწმე', bad: 'ყურადღება' }[level];
  const nextDay = FERM_DAYS.find(d => d > e.day);
  const next = finished ? 'შემდეგი: cold crash და ჩამოსხმა.' : nextDay ? `შემდეგი ჩანაწერი: დღე ${nextDay}${nextDay >= 7 ? ' (FG-თი)' : ''}.` : 'შემდეგი: FG ხელახლა 2 დღეში.';
  return { level, title, pts, next, finished };
}

/* ფორმის დროებითი მდგომარეობა (შენახვამდე) */
let fermDraft = null;
const blankEntry = day => ({ day, temp: null, airlock: '', foam: '', note: '', fg: null });
const FERM_MAX_DAY = 40;
function fermDays(b) { return [...new Set([...FERM_DAYS, ...b.fermentationLog.map(e => e.day)])].sort((x, y) => x - y); }
function fermDefaultDay(b) {
  const dayNow = daysBetween(brewDay(b), todayStr());
  const has = d => b.fermentationLog.some(e => e.day === d);
  const days = fermDays(b);
  const due = days.filter(d => !has(d) && d <= dayNow);            // გამოტოვებული ან დღევანდელი
  if (due.length) return due[due.length - 1];
  if (has(dayNow)) return dayNow;
  return days.find(d => !has(d)) ?? days[days.length - 1];
}
function fermSelect(b, day) {
  const ex = b.fermentationLog.find(x => x.day === day);
  fermDraft = { batchId: b.id, sel: day, e: ex ? clone(ex) : blankEntry(day), editing: !ex };
}
function viewFerm(b) {
  if (!fermDraft || fermDraft.batchId !== b.id) fermSelect(b, fermDefaultDay(b));
  const dayNow = daysBetween(brewDay(b), todayStr());
  const log = b.fermentationLog.slice().sort((x, y) => x.day - y.day);
  const days = fermDays(b);
  const sel = fermDraft.sel, e = fermDraft.e;
  const entry = log.find(x => x.day === sel);
  const A = entry ? assessFerm(b, entry) : null;
  const last = log[log.length - 1], lastA = last ? assessFerm(b, last) : null;
  const dot = lv => `<span class="dot ${lv}"></span>`;
  const chip = d => {
    const x = log.find(y => y.day === d); const lv = x ? assessFerm(b, x).level : null;
    return `<button type="button" class="${d === sel ? 'sel' : ''} ${x ? 'has' : ''} ${d === dayNow ? 'now' : ''} ${d > dayNow ? 'future' : ''}" data-act="fermSelect" data-day="${d}" aria-pressed="${d === sel}">
      ${lv ? dot(lv) : ''}${d}<small>${FG_DAYS[d] ? 'FG' : FERM_DAYS.includes(d) ? 'დღე' : 'დამატ.'}</small></button>`;
  };
  const form = `<div class="sec" style="gap:12px">
      <label class="field"><span class="lbl">ტემპერატურა</span>${unitInput('id="fd-temp" data-fd="temp" data-num="1" placeholder="მაგ. 24"', e.temp ?? '', '°C')}</label>
      <div class="field"><span class="lbl small muted" style="font-weight:600">საკეტი</span>
        <div class="chips" id="fd-air">${AIRLOCK.map((a2, k) => `<button type="button" class="${e.airlock === a2 ? 'on' : ''} ${['', 'slow', 'stop'][k]}" aria-pressed="${e.airlock === a2}" data-act="fermAir" data-v="${a2}">${ic(['bubbles', 'drop', 'pause'][k])}${a2}</button>`).join('')}</div></div>
      <div class="grid2">
        <label class="field"><span class="lbl">ქაფი (სადამდე)</span><input id="fd-foam" data-fd="foam" value="${esc(e.foam)}" placeholder="მაგ. 2 სმ"></label>
        <label class="field"><span class="lbl">FG${sel >= 7 ? '' : ' (მე-7 დღიდან)'}</span>${unitInput('id="fd-fg" data-fd="fg" data-num="1"', e.fg ?? '', 'Bx')}</label>
      </div>
      <label class="field"><span class="lbl">შენიშვნა</span><input id="fd-note" data-fd="note" value="${esc(e.note)}" placeholder="სუნი, ფერი, რამე უცნაური"></label>
      <button class="primary" data-act="fermSave">${ic('check')} ${entry ? 'ცვლილების შენახვა' : 'შენახვა და შეფასება'}</button>
      ${entry ? `<button class="ghost" data-act="fermDelete">${ic('trash')} ჩანაწერის წაშლა</button>` : ''}
    </div>`;
  return `${appbar('დადუღება', `#/batch/${b.id}`)}<main class="wrap">
    <section class="paper label-cut panel airlock-hero">
      ${airlockSvg(last ? last.airlock : '')}
      <div class="sec" style="gap:4px">
        <span class="eyebrow">${esc(b.name)}</span>
        <h2 style="font-size:1.6rem">${dayNow >= 0 ? `დუღილის ${dayNow}-ე დღე` : 'ჯერ არ დაწყებულა'}</h2>
        <p class="muted small">ხარშვის დღე: ${fmtDate(brewDay(b))}</p>
        ${lastA ? `<p class="small" style="display:flex;gap:8px;align-items:center">${dot(lastA.level)}<span>${esc(lastA.title)} — ბოლო ჩანაწერი: დღე ${last.day}</span></p>` : '<p class="small muted">ჩანაწერი ჯერ არ არის.</p>'}
      </div>
    </section>
    <section class="paper panel" style="gap:10px">
      <div class="sec-head" style="margin:0"><h3>გრაფიკი</h3><span class="small muted">${log.length} / ${days.length} ჩაწერილი</span></div>
      <div class="days">${days.map(chip).join('')}<button type="button" class="add" data-act="fermAddDay" aria-label="სხვა დღის დამატება">${ic('plus')}<small>სხვა</small></button></div>
      <p class="hint">დღეები 1, 2, 3, 5 — ტემპერატურა და საკეტი; დღეები 7 და 9 — FG. ორი ერთნაირი FG = დასრულდა.</p>
    </section>

    <section class="paper panel ${A ? `assess ${A.level}` : ''}" id="ferm-day" style="gap:12px">
      <div class="sec-head" style="margin:0"><h2 style="font-size:1.5rem">${A ? dot(A.level) : ''} დღე ${sel}${FG_DAYS[sel] ? ` · ${FG_DAYS[sel]}` : ''}</h2><span class="small muted">${fmtDate(addDays(brewDay(b), sel))}${sel === dayNow ? ', დღეს' : sel > dayNow ? ', მომავალი' : ''}</span></div>

        <details ${fermDraft.editing ? 'open' : ''}><summary>${ic('edit')} ჩანაწერის რედაქტირება${ic('chev', 'chev')}</summary><div class="inner">${form}</div></details>`
      : (sel > dayNow + 1 ? msgHtml('info', `ეს დღე ${fmtDate(addDays(brewDay(b), sel))}-ს დგება — ჩაწერე, როცა მოვა.`) : '') + form}
    </section>
    <label class="field"><span class="lbl">Brix-ის ინსტრუმენტი</span><select id="f-instr" data-bind="batch:instrument">
      <option value="hydro" ${b.instrument !== 'refract' ? 'selected' : ''}>არეომეტრი — SG = 1 + Brix × 0.004</option>
      <option value="refract" ${b.instrument === 'refract' ? 'selected' : ''}>რეფრაქტომეტრი — ალკოჰოლის კორექციით</option></select></label>
  </main>${tabbar('home')}`;
}

function getPath(o, path) { return path.split('.').reduce((x, k) => x == null ? x : x[k], o) ?? ''; }

function rescaleRecipe(r, oldTotal, newTotal) {
