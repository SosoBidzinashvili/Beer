/* =====================================================================
   9. რენდერი და მოვლენები
   ===================================================================== */
function render() {
  const rt = route();
  let html;
  const b = rt.id ? getBatch(rt.id) : null;
  switch (rt.name) {
    case 'new': html = viewNew(); break;
    case 'batch': html = b ? viewBatch(b) : null; break;
    case 'brew': html = b ? viewBrew(b) : null; break;
    case 'ferm': html = b ? viewFerm(b) : null; break;
    case 'bottle': html = b ? viewBottle(b) : null; break;
    case 'export': html = b ? viewExport(b) : null; break;
    case 'recipes': html = viewRecipes(); break;
    case 'recipe': { const r = getRecipe(rt.id); html = r ? viewRecipe(r) : null; break; }
    case 'brecipe': html = b && b.recipe ? viewRecipe(b.recipe, b) : null; break;
    case 'settings': html = viewSettings(); break;
    default: html = viewHome();
  }
  if (html == null) { location.hash = '#/'; return; }
  $('#app').innerHTML = html;
  tick();
  applyWake();
}
const go = h => { if (location.hash === h) render(); else location.hash = h; };
const curBatch = () => getBatch(route().id);
const goStepTop = () => { render(); scrollTo(0, 0); };

/* ველების შენახვა: data-bind="სახე:გასაღები" */
function onBind(el, isChange) {
  const [kind, ...p] = el.dataset.bind.split(':');
  const raw = el.type === 'checkbox' ? el.checked : el.value;
  const v = el.dataset.num ? num(raw) : raw;
  const b = curBatch();
  switch (kind) {
    case 'reading':
      if (num(raw) == null) delete b.readings[p[0]];
      else b.readings[p[0]] = { value: num(raw), time: Date.now() };
      save(); refreshBrewLive(b);
      break;
    case 'check': {
      b.checks[p[0]] = b.checks[p[0]] || {};
      b.checks[p[0]][p[1]] = raw;
      el.closest('.check').classList.toggle('done', raw);
      const cnt = $(`#cnt-${p[0]}`);
      if (cnt) cnt.textContent = `${Object.values(b.checks[p[0]]).filter(Boolean).length}/${cnt.dataset.total}`;
      save(); break;
    }
    case 'batch':
      b[p[0]] = raw; save();
      if (isChange && ['status', 'instrument', 'date', 'recipeId'].includes(p[0])) render();
      break;
    case 'ferm': {
      const e = ensureFerm(b, +p[0]);
      e[p[1]] = v; save();
      $('#ferm-live').innerHTML = fermLiveHtml(b);
      break;
    }
    case 'bottle':
      b.bottling[p[0]] = v;
      if (p[0] === 'volume') b.bottling.sugar = v ? round1(v * SUGAR_G_PER_L) : null;
      save(); if (p[0] === 'volume' || p[0] === 'bottles') $('#bottle-live').innerHTML = bottleLiveHtml(b);
      break;
    case 'rec': {
      const r = editTarget();
      if (el.dataset.ebc) setPath(r, p[0], num(raw));   // ცარიელი = ავტომატური
      else setPath(r, p[0], el.dataset.num ? (v ?? 0) : v);
      if (isChange && el.dataset.rescale) {
        const nt = grainTotal(r);
        if (rescaleRecipe(r, recipeBaseTotal, nt)) toast(`გადაითვალა: წყალი ${r.mashWaterL} ლ, სვია ×${fmt(nt / recipeBaseTotal, 2)}`);
        recipeBaseTotal = nt;
      }
      if (isChange) syncRecipeInputs(r);
      save(); flashSaved(); break;
    }
    case 'setting':
      S.settings[p[0]] = raw; save(); applyWake();
      if (p[0] === 'debug') toast(raw ? 'Debug: ახალი ტაიმერები 10 წამი' : 'Debug გამორთულია');
      break;
  }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT') onBind(el, false);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind) onBind(el, true);
  if (el.dataset.total) {   // მარცვლის ჯამის ველი
    const r = editTarget(), nt = num(el.value), ot = grainTotal(r);
    if (nt && ot) {
      r.grains.forEach(g => { g.grams = Math.round(g.grams * nt / ot); });
      const real = grainTotal(r);
      if (rescaleRecipe(r, recipeBaseTotal, real)) toast(`გადაითვალა: წყალი ${r.mashWaterL} ლ`);
      recipeBaseTotal = real;
      save(); syncRecipeInputs(r); flashSaved();
    }
  }
  if (el.id === 'importFile' && el.files[0]) el.files[0].text().then(importJson);
});

/* ღილაკების მოქმედებები: data-act="სახელი" */
const ACTIONS = {
  createBatch() {
    const recipeId = $('#nb-recipe').value;
    const b = migrate({ batches: [{ id: uid(), name: $('#nb-name').value.trim() || 'პარტია', date: $('#nb-date').value || todayStr(), recipeId, status: 'planned', created: Date.now() }] }).batches[0];
    S.batches.push(b); save(); go(`#/batch/${b.id}`);
  },
  openBrew() {
    const b = curBatch();
    if (!b.recipe) b.recipe = clone(recipeOf(b));   // რეცეპტის ფიქსაცია
    if (b.status === 'planned') b.status = 'brewing';
    save(); ensureAudio(); askNotify(); go(`#/brew/${b.id}`);
  },
  goBatch() { go(`#/batch/${route().id}`); },
  goFerm() { go(`#/ferm/${route().id}`); },
  goBottle() { go(`#/bottle/${route().id}`); },
  goExport() { go(`#/export/${route().id}`); },
  goStep(el) { const b = curBatch(); b.cur = +el.dataset.i; save(); ACTIONS.openBrew(); },
  stepBack() { const b = curBatch(); if (b.cur > 0) { b.cur--; save(); goStepTop(); } },
  stepSkip() { const b = curBatch(); if (b.cur < STEPS.length - 1) { b.cur++; save(); goStepTop(); } else toast('ეს ბოლო ნაბიჯია'); },
  stepDone() {
    const b = curBatch(), r = recipeOf(b), st = STEPS[b.cur], c = calc(b, r);
    const gate = st.gate && st.gate(r, b, c);
    if (gate) { toast(`${gate} — ან „გამოტოვება"`); return; }
    ensureAudio();
    if (st.autoTimer && !b.timers[st.autoTimer]) startTimer(b, st.autoTimer);
    b.stepsDone[st.key] = Date.now();
    if (navigator.vibrate) navigator.vibrate(15);
    if (b.cur < STEPS.length - 1) {
      b.cur++; save(); goStepTop();
      const ns = STEPS[b.cur];
      if (ns.stage !== st.stage) {   // ეტაპი დასრულდა
        const a = STAGES[st.stage], z = STAGES[ns.stage];
        toast(`<span style="display:flex;gap:10px;align-items:center;justify-content:center">${ic('sparkle')} ${esc(a.name)} — მზადაა!</span><span class="small" style="opacity:.75">შემდეგი: ${esc(z.letter)}. ${esc(z.name)}</span>`, true);
      }
      return;
    }
    // ბოლო ნაბიჯი: ხარშვა დასრულდა
    b.status = 'fermenting';
    FERM_DAYS.forEach(d => ensureFerm(b, d));
    b.fermentationLog.forEach(e => { e.date = addDays(brewDay(b), e.day); });
    save(); go(`#/batch/${b.id}`);
    const c2 = calc(b, r);
    celebrate('გაუმარჯოს!', `ხარშვა დასრულდა${c2.ready ? ` · ${fmt(val(b, 'finalVol') || c2.vol, 1)} ლ · OG ${c2.og.toFixed(3)}` : ''}. საფუარი უკვე მუშაობს.`,
      beerColor(r), 'დადუღების დღიური', `#/ferm/${b.id}`);
  },
  pickRecipe(el) {
    document.querySelectorAll('.pick').forEach(p => { const on = p === el; p.classList.toggle('on', on); p.setAttribute('aria-checked', on); });
    $('#nb-recipe').value = el.dataset.id;
    const r = getRecipe(el.dataset.id);
    const nm = $('#nb-name');   // ავტომატური სახელი იცვლება, სანამ ხელით არ შეცვლი
    if (nm && nm.value === nm.dataset.last) { nm.value = nm.dataset.last = `${r.name} #${S.batches.filter(b => b.recipeId === r.id).length + 1}`; }
  },
  openMap() {
    const b = curBatch();
    const m = $('#modal');
    m.innerHTML = `<div class="sheet"><div class="sec-head" style="margin:0"><h2>${ic('map')} ნაბიჯების რუკა</h2><button class="icon-btn ghost" id="mapClose" aria-label="დახურვა">${ic('close')}</button></div>
      <div class="map">${STAGES.map((sg, si) => `<div class="grp" style="--stage:${sg.color}">
        <div class="grp-h">${ic(sg.icon)} ${sg.letter}. ${sg.name}</div>
        ${STEPS.map((s, k) => s.stage === si ? `<button type="button" class="${k === b.cur ? 'cur' : ''} ${b.stepsDone[s.key] ? 'ok' : ''}" data-act="mapGo" data-i="${k}">
          ${ic(b.stepsDone[s.key] ? 'check' : k === b.cur ? 'chev' : 'minus')}<span>${k + 1}. ${s.title}</span></button>` : '').join('')}
      </div>`).join('')}</div></div>`;
    m.classList.add('on');
    const close = () => { m.classList.remove('on'); m.innerHTML = ''; };
    $('#mapClose').onclick = close;
    m.onclick = e => { if (e.target === m) close(); };
    const cur = m.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
  },
  mapGo(el) {
    const b = curBatch(); b.cur = +el.dataset.i; save();
    $('#modal').classList.remove('on'); $('#modal').innerHTML = '';
    goStepTop();
  },
  setAirlock(el) {
    const b = curBatch(), e = ensureFerm(b, +el.dataset.day);
    e.airlock = e.airlock === el.dataset.v ? '' : el.dataset.v; save(); render();
  },
  scrollDay(el) { const t = $(`#day-${el.dataset.day}`); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  nudge(el) {
    const b = curBatch(), r = recipeOf(b), st = STEPS[b.cur], c = calc(b, r);
    const inp = st.inputs.find(x => x.k === el.dataset.k);
    const cur = val(b, inp.k);
    const next = cur == null ? inp.start(r, b, c) : Math.round((cur + +el.dataset.d * inp.step) * 100) / 100;
    b.readings[inp.k] = { value: next, time: Date.now() };
    $(`#rd-${inp.k}`).value = next;
    save(); refreshBrewLive(b);
  },
  nudgeBottle(el) {
    const b = curBatch(), cur = b.bottling.volume;
    const v = cur == null ? round1(val(b, 'finalVol') || 3.5) : Math.max(0, Math.round((cur + +el.dataset.d * 0.1) * 100) / 100);
    b.bottling.volume = v; b.bottling.sugar = round1(v * SUGAR_G_PER_L);
    $('#bt-vol').value = v; $('#bottle-live').innerHTML = bottleLiveHtml(b); save();
  },
  toggleWake() { S.settings.wake = !S.settings.wake; save(); render(); toast(S.settings.wake ? 'ეკრანი არ დაიძინებს' : 'ეკრანი ჩვეულებრივ დაიძინებს'); },
  timerStart(el) { const b = curBatch(); startTimer(b, el.dataset.t); render(); },
  timerPause(el) { const b = curBatch(); togglePause(b.timers[el.dataset.t]); save(); render(); },
  timerAdj(el) { const b = curBatch(); adjustTimer(b, el.dataset.t, +el.dataset.d); save(); render(); },
  async timerReset(el) {
    if (!await ask('ტაიმერი თავიდან დაიწყოს? მიმდინარე დრო დაიკარგება.', 'თავიდან დაწყება', true)) return;
    const b = curBatch(); delete b.timers[el.dataset.t]; save(); render();
  },
  alertMute() { stopAlarm(); alertQueue.shift(); renderOverlay(); },
  alertGo() {
    stopAlarm();
    const a = alertQueue.shift(); renderOverlay();
    const b = getBatch(a.batchId); const i = STEPS.findIndex(s => s.key === a.step);
    if (b && i >= 0) { b.cur = i; save(); go(`#/brew/${b.id}`); scrollTo(0, 0); }
  },
  async deleteBatch() {
    const b = curBatch();
    if (!await ask(`წავშალო „${b.name}"? ყველა ჩანაწერი დაიკარგება.`, 'წაშლა', true)) return;
    S.batches = S.batches.filter(x => x !== b); save(); go('#/');
  },
  addFermDay() {
    const b = curBatch();
    const last = Math.max(9, ...b.fermentationLog.map(e => e.day));
    ensureFerm(b, last + 2); save(); render();
  },
  markBottled() {
    const b = curBatch();
    if (!b.bottling.date) b.bottling.date = todayStr();
    if (b.bottling.fg == null) { const fs = fermStats(b); if (fs.fgBrix != null) b.bottling.fg = fs.fgBrix; }
    b.status = 'bottled'; save(); render();
    const n = b.bottling.bottles || (b.bottling.volume ? Math.floor(b.bottling.volume / 0.5) : null);
    celebrate('ჩამოსხმულია!', `${n ? `${n} ბოთლი · ` : ''}გემო ${fmtDate(addDays(b.bottling.date, 14))}-ს. მოთმინება — ცოტაც და მზადაა.`,
      beerColor(recipeOf(b)), 'პარტიაზე დაბრუნება', `#/batch/${b.id}`);
  },
  markDone() { const b = curBatch(); b.status = 'done'; save(); toast('პარტია დასრულდა'); render(); },
  copyMd() { copyText($('#md').value); },
  newRecipe() {
    const r = clone(DEFAULT_RECIPES[0]); r.id = uid(); r.name = 'ახალი რეცეპტი'; r.style = '';
    S.recipes.push(r); save(); go(`#/recipe/${r.id}`);
  },
  dupRecipe() {
    const r = clone(editTarget()); r.id = uid(); r.name += ' (ასლი)';
    S.recipes.push(r); save(); toast('დუბლირებულია'); go(`#/recipe/${r.id}`);
  },
  async delRecipe() {
    if (S.recipes.length < 2) { toast('ბოლო რეცეპტს ვერ წაშლი'); return; }
    const r = editTarget();
    const used = S.batches.filter(b => !b.recipe && b.recipeId === r.id).length;
    if (!await ask(`წავშალო „${r.name}"?${used ? ` ${used} დაგეგმილი პარტია პირველ რეცეპტზე გადავა.` : ''}`, 'წაშლა', true)) return;
    S.recipes = S.recipes.filter(x => x !== r); save(); go('#/recipes');
  },
  async restoreRecipes() {
    if (!await ask('ჩაშენებული რეცეპტები დაბრუნდეს საწყის მნიშვნელობებზე? შენი სხვა რეცეპტები არ შეიცვლება.', 'აღდგენა')) return;
    DEFAULT_RECIPES.forEach(d => {
      const i = S.recipes.findIndex(r => r.id === d.id);
      if (i >= 0) S.recipes[i] = clone(d); else S.recipes.push(clone(d));
    });
    save(); toast('აღდგენილია'); render();
  },
  saveBatchRecipeToLib() {
    const r = clone(editTarget()); r.id = uid();
    S.recipes.push(r); save(); toast(`„${r.name}" ბიბლიოთეკაში დაემატა`);
  },
  async resetBatchRecipe() {
    const b = curBatch();
    if (!await ask('პარტიის რეცეპტი ჩანაცვლდეს ბიბლიოთეკის ვერსიით?', 'ჩანაცვლება', true)) return;
    b.recipe = clone(getRecipe(b.recipeId)); save(); render();
  },
  addRow(el) {
    const r = editTarget();
    if (el.dataset.list === 'grains') r.grains.push({ name: '', grams: 0, minute: 0 });
    else r.hops.push({ name: '', grams: 0, minute: 0 });
    save(); render();
    const ix = r[el.dataset.list].length - 1;
    const inp = $(`#r-${el.dataset.list === 'grains' ? 'g' : 'h'}${ix}-n`); if (inp) inp.focus();
  },
  async rmRow(el) {
    const r = editTarget(), item = r[el.dataset.list][+el.dataset.i];
    if (!await ask(`წავშალო „${item.name || 'ეს რიგი'}"?`, 'წაშლა', true)) return;
    r[el.dataset.list].splice(+el.dataset.i, 1);
    if (el.dataset.list === 'grains') rescaleRecipe(r, recipeBaseTotal, grainTotal(r));
    save(); render();
  },
  notifyPerm() {
    if (!('Notification' in window)) { toast('ბრაუზერი არ უჭერს მხარს'); return; }
    Notification.requestPermission().then(render);
  },
  testAlarm() { ensureAudio(); playAlarm(); toast('ხმა უნდა ისმოდეს'); },
  exportJson() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `brew-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  copyJson() { copyText(JSON.stringify(S)); },
  importText() { importJson($('#importText').value); },
  async resetAll() {
    if (!await ask('ყველა პარტია და რეცეპტი წაიშლება. ჯერ სარეზერვო ასლი გააკეთე.', 'ყველაფრის წაშლა', true)) return;
    S = freshState(); save(); go('#/');
  }
};

async function importJson(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('JSON ვერ წავიკითხე — შეამოწმე ტექსტი'); return; }
  if (!obj || !Array.isArray(obj.batches) || !Array.isArray(obj.recipes)) { toast('ეს არ არის ამ აპის სარეზერვო ასლი'); return; }
  if (!await ask(`იმპორტი: ${obj.batches.length} პარტია, ${obj.recipes.length} რეცეპტი. არსებული მონაცემები ჩანაცვლდება.`, 'იმპორტი', true)) return;
  S = migrate(obj); save(); toast('იმპორტი დასრულდა'); go('#/');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('დაკოპირდა'); return; } catch (e) { /* fallback ქვემოთ */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('დაკოპირდა'); } catch (e) { toast('მონიშნე ტექსტი და დააკოპირე ხელით'); }
  ta.remove();
}

document.addEventListener('click', e => {
  ensureAudio();   // ბრაუზერს ხმისთვის მომხმარებლის შეხება სჭირდება
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { tick(); applyWake(); });
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { S = load(); render(); } });

render();
setInterval(tick, 500);
</script>
</body>
</html>
